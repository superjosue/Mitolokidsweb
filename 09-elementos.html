<!--
  MitoloKids · "Tuerquita y la máquina de los elementos" (ciencia para 5 años: átomos, elementos y la tabla periódica)
  Paleta (tinta + acuarela sucia sobre papel viejo):
    papel #efe4cb · sepia #8a6a48 · óxido #a8552e · ocre #c49a4c · oliva #7f7b52 · turquesa desvaído #5f8a86
    hollín #3a2e26 · tinta #2b2119. Cada elemento tiene UN color saturado que solo aparece cuando "se enciende":
    H celeste #8fd3ec · O coral #e0674a · C carbón #4a4540 (brasa) · He rosa #e79cc4 · Fe óxido-gris #8a6d5c · Au oro #f0b834
  Técnica: 2D pintado a mano. Contornos de tinta temblorosos de grosor variable con remates que se pasan de las esquinas
    (cintas rellenas generadas por ruido con semilla), rayado a lápiz para las sombras, aguadas de acuarela en dos capas con
    borde más oscuro y floraciones, papel con grano, manchas de café y viñeta (multiplicar). Las líneas de los personajes
    "hierven" (se redibujan con otra semilla cada 1/8 s) y las poses van "a doses" (12 poses por segundo).
    Fondos cacheados en lienzos fuera de pantalla (2 variantes de hervido).
  Mundo: un pueblo de máquinas oxidadas al atardecer, una torre chueca con un taller arriba; tuberías, remaches,
    manómetros, válvulas, engranes, chimeneas con vapor, lámparas que parpadean.
  Tipografía: Gochi Hand (rótulos a mano en placas de latón y etiquetas de papel) + Patrick Hand (símbolos de los cajones).
  Momento estrella: la TABLA PERIÓDICA como gran gabinete de madera y latón con 118 cajoncitos en su forma real
    (lantánidos y actínidos abajo); los cajones saltan con un resorte y sale el elemento, un átomo vivo que brilla.
    Y: dos hidrógenos y un oxígeno se toman de la mano y se vuelven una gota de agua.
  Personajes (originales): Tuerquita (robotita de chatarra: un gran ojo de vidrio, cuello telescópico, piernas de resorte,
    orejas de tuerca) y Don Pistón (inventor-tetera de cobre sobre ruedas, con gogles, bigote de alambre y un brazo
    telescópico con lupa; su pico echa vapor cuando habla).
-->

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eo=t=>1-Math.pow(1-clamp(t),3);

/* ---------- colour ---------- */
const INK='#2b2119',PAPER='#efe4cb';

const rgba=(h,a)=>{const c=rgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
function shade(h,k){const c=rgb(h),t=k<0?0:255,a=Math.abs(k);return`rgb(${Math.round(lerp(c[0],t,a))},${Math.round(lerp(c[1],t,a))},${Math.round(lerp(c[2],t,a))})`}

/* ---------- shapes ---------- */
function poly(p){X.beginPath();X.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)X.lineTo(p[i][0],p[i][1]);X.closePath()}
function ellP(cx,cy,rx,ry,n=24,rot=0){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU+rot;p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function rrP(x,y,w,h,r){r=Math.max(.5,Math.min(r,w/2,h/2));const p=[],c=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];for(const[cx,cy,a0]of c)for(let k=0;k<=3;k++){const a=a0+k/3*Math.PI/2;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
function dropP(cx,cy,r){const p=[[cx,cy-r*1.75]];for(let i=0;i<=22;i++){const a=-Math.PI/2+.72+i/22*(TAU-1.44);p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
const C=(x,y,r)=>{X.beginPath();X.arc(x,y,Math.max(.01,r),0,TAU);X.fill()};
const E=(x,y,rx,ry,rot=0)=>{X.beginPath();X.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,TAU);X.fill()};

/* ---------- hand-drawn toolkit ---------- */
/* densify a polyline and push it sideways with smooth seeded noise: the wobble of a hand-held pen */
function wob(p,closed,seed,amp=1.2,step=12){
  const o=[],n=p.length,segs=closed?n:n-1;let d=0;
  for(let i=0;i<segs;i++){const a=p[i],b=p[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1e-3,k=Math.max(1,Math.ceil(L/step)),nx=-dy/L,ny=dx/L;
    for(let j=0;j<k;j++){const t=j/k,w=vn((d+t*L)*.05,seed)*amp;o.push([a[0]+dx*t+nx*w,a[1]+dy*t+ny*w])}d+=L}
  if(!closed){const b=p[n-1];o.push([b[0],b[1]])}

}
/* a filled ribbon of varying width along a polyline, tapered at both ends (ink pen pressure) */
function ribbon(q,w,s,tp){const n=q.length;if(n<2)return;const Lp=[],Rp=[],tn=Math.max(1,n*tp);
  for(let i=0;i<n;i++){const a=q[Math.max(0,i-1)],b=q[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    const e=Math.min(1,(i+.7)/tn,(n-i-.3)/tn),ww=w*.5*(.6+.77*(vn(i*.4,s+5)+1)*.5)*(.3+.7*Math.sqrt(clamp(e)));
    Lp.push(q[i][0]-dy*ww,q[i][1]+dx*ww);Rp.push(q[i][0]+dy*ww,q[i][1]-dx*ww)}
  X.beginPath();X.moveTo(Lp[0],Lp[1]);for(let i=2;i<Lp.length;i+=2)X.lineTo(Lp[i],Lp[i+1]);for(let i=Rp.length-2;i>=0;i-=2)X.lineTo(Rp[i],Rp[i+1]);X.closePath();X.fill()}
/* ink contour: open lines overshoot their ends, closed ones loop past their start. Boils with BO. */
function ink(p,closed,w=2.2,sd=1,col=INK,amp=1.1){
  const s=sd*1.618+BO*7.31;let q;
  if(closed){const k=Math.max(2,Math.ceil(p.length*.14));q=wob(p.concat(p.slice(0,k+1)),false,s,amp)}
  else{const a=p[0],b=p[1],c=p[p.length-2],d=p[p.length-1],ov=1.5+h1(s)*3.5,l1=Math.hypot(a[0]-b[0],a[1]-b[1])||1,l2=Math.hypot(d[0]-c[0],d[1]-c[1])||1;
    q=wob([[a[0]+(a[0]-b[0])/l1*ov,a[1]+(a[1]-b[1])/l1*ov],...p.slice(1,-1),[d[0]+(d[0]-c[0])/l2*ov,d[1]+(d[1]-c[1])/l2*ov]],false,s,amp)}
  X.fillStyle=col;ribbon(q,w,s,closed?.06:.2);
}
function inkR(x,y,w,h,lw,sd,col=INK){ink([[x,y],[x+w,y]],false,lw,sd,col);ink([[x+w,y],[x+w,y+h]],false,lw,sd+1,col);ink([[x+w,y+h],[x,y+h]],false,lw,sd+2,col);ink([[x,y+h],[x,y]],false,lw,sd+3,col)}
/* faint graphite construction line beside the ink */
function pen(p,closed,sd,a=.3,lw=.8){const q=wob(p,closed,sd*2.3+BO*3.1+40,2.6,16);X.save();X.strokeStyle=`rgba(70,52,38,${a})`;X.lineWidth=lw;X.beginPath();X.moveTo(q[0][0],q[0][1]);for(const v of q)X.lineTo(v[0],v[1]);if(closed)X.closePath();X.stroke();X.restore()}
function base(p,col){X.fillStyle=col;poly(p);X.fill()}
/* watercolour: two offset translucent layers + a darker pooled edge */
function wash(p,col,sd,a=1,edge=.45){const ga=X.globalAlpha;X.save();X.fillStyle=col;const q=wob(p,true,sd+3,2,22);X.globalAlpha=ga*a*.72;poly(q);X.fill();X.globalAlpha=ga*a*.42;poly(wob(p,true,sd+8,3,22));X.fill();
  X.globalAlpha=ga*a*edge;X.strokeStyle=shade(col,-.45);X.lineWidth=2.2;poly(q);X.stroke();X.restore()}
function blot(x,y,r,col,a=.5){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a*.35));g.addColorStop(.7,rgba(col,a*.5));g.addColorStop(.9,rgba(col,a*.75));g.addColorStop(1,rgba(col,0));X.fillStyle=g;X.beginPath();X.arc(x,y,r,0,TAU);X.fill()}
function glow(x,y,r,c,a){if(a<=0)return;X.save();X.globalCompositeOperation='lighter';const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(.35,`rgba(${c},${a*.4})`);g.addColorStop(1,`rgba(${c},0)`);X.fillStyle=g;X.beginPath();X.arc(x,y,r,0,TAU);X.fill();X.restore()}
/* pencil hatching clipped to a shape (and optionally a region) */
function hatch(p,ang,sp,a,sd,reg,col=INK,lw=.9){

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const v of p){x0=Math.min(x0,v[0]);y0=Math.min(y0,v[1]);x1=Math.max(x1,v[0]);y1=Math.max(y1,v[1])}
  const cx=(x0+x1)/2,cy=(y0+y1)/2,R=Math.hypot(x1-x0,y1-y0)/2+2,ca=Math.cos(ang),sa=Math.sin(ang),n=p.length;
  X.save();X.strokeStyle=col;X.globalAlpha*=a;X.lineWidth=lw;X.beginPath();
  for(let d=-R,i=0;d<=R;d+=sp,i++){const j=(h1(i*7.1+sd)-.5)*sp*.6,px=cx-sa*(d+j),py=cy+ca*(d+j);
    let lo=-R,hi=R;if(reg){for(const[pc,dc,mn,mx]of[[px,ca,reg[0],reg[2]],[py,sa,reg[1],reg[3]]]){if(Math.abs(dc)<1e-9){if(pc<mn||pc>mx){lo=1;hi=0}}else{let ta=(mn-pc)/dc,tb=(mx-pc)/dc;if(ta>tb)[ta,tb]=[tb,ta];lo=Math.max(lo,ta);hi=Math.min(hi,tb)}}if(lo>=hi)continue}
    const ts=[];for(let k=0;k<n;k++){const A=p[k],B=p[(k+1)%n],ex=B[0]-A[0],ey=B[1]-A[1],den=ca*ey-sa*ex;if(Math.abs(den)<1e-9)continue;const wx=A[0]-px,wy=A[1]-py,t=(wx*ey-wy*ex)/den,u=(wx*sa-wy*ca)/den;if(u>=0&&u<1)ts.push(t)}
    ts.sort((m,q)=>m-q);const sh=(h1(i+sd*3)-.5)*3,sh2=(h1(i*2.3+sd)-.5)*3;
    for(let k=0;k+1<ts.length;k+=2){const ta=Math.max(lo,ts[k]+sh),tb=Math.min(hi,ts[k+1]+sh2);if(tb<=ta)continue;X.moveTo(px+ca*ta,py+sa*ta);X.lineTo(px+ca*tb,py+sa*tb+(h1(i+sd)-.5)*1.5)}}
  X.stroke();X.restore()}
const HAND="'Gochi Hand','Patrick Hand',cursive",LBL="'Patrick Hand','Gochi Hand',cursive";
function txt(s,x,y,size,col=INK,font=HAND,rot=0,align='center'){X.save();X.translate(x,y);X.rotate(rot);X.font=`${size}px ${font}`;X.textAlign=align;X.textBaseline='middle';X.fillStyle=col;const ga=X.globalAlpha;X.globalAlpha=ga*.4;X.fillText(s,size*.025,size*.03);X.globalAlpha=ga;X.fillText(s,0,0);X.restore()}
function rivets(x0,y0,x1,y1,n,r=2){for(let i=0;i<n;i++){const t=n>1?i/(n-1):0,x=lerp(x0,x1,t),y=lerp(y0,y1,t);X.fillStyle='rgba(43,33,25,.75)';C(x,y,r);X.fillStyle='rgba(255,240,210,.5)';C(x-r*.35,y-r*.35,r*.35)}}
/* brass plate with rivets; draw() writes on it */
function plate(x,y,w,h,sd,draw,col='#c49a4c'){const p=rrP(x-w/2,y-h/2,w,h,Math.min(14,h*.3));base(p,PAPER);wash(p,col,sd);X.save();poly(p);X.clip();blot(x+w*.3,y+h*.2,h*.9,'#7a5424',.5);blot(x-w*.35,y-h*.3,h*.7,'#5f8a78',.35);X.restore();

/* paper tag with a hole on the left */
function tagP(x,y,w,h,rot,text,size,sd,col='#efe2c2'){X.save();X.translate(x,y);X.rotate(rot);const p=[[-w/2+h*.35,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2+h*.35,h/2],[-w/2,0]];base(p,col);wash(p,'#d9c49a',sd,.5,.3);ink(p,true,Math.max(1.1,h*.06),sd+1);X.fillStyle=INK;C(-w/2+h*.3,0,Math.max(1,h*.08));txt(text,w*.08,h*.04,size,INK,HAND);X.restore()}
/* word tag that pops with a spring */
function wordTag(x,y,text,size,k,sd,rot=-.05){if(k<=0)return;X.save();X.globalAlpha*=clamp(k*3);X.translate(x,y);const s=eob(k);X.scale(s,s);X.font=`${size}px ${HAND}`;const w=X.measureText(text).width+size*1.3;tagP(0,0,w,size*1.35,rot+Math.sin(TQ*2+sd)*.03,text,size,sd);X.restore()}

/* steam puffs rising from (x,y) */

/* ---------- lip sync from the recorded voice clips ---------- */
const ENV=[];
function analyze(i,b){
  const d=b.getChannelData(0),sr=b.sampleRate,hop=Math.floor(sr/60),n=Math.floor(d.length/hop),rms=new Float32Array(n),z=new Float32Array(n);let mx=1e-6;
  for(let k=0;k<n;k++){let s=0,c=0;for(let j=k*hop+1;j<(k+1)*hop;j++){s+=d[j]*d[j];if((d[j]>0)!==(d[j-1]>0))c++}rms[k]=Math.sqrt(s/hop);z[k]=c/hop;if(rms[k]>mx)mx=rms[k]}
  for(let k=0;k<n;k++)rms[k]=Math.pow(rms[k]/mx,.6);ENV[i]={rms,z};
}
function mouthOf(who){
  const L=activeLine();if(!L||L.who!==who)return{open:0,wide:0};const e=ENV[L.i];
  if(e&&voiceOn){const k=Math.floor((T-L.t)*60);if(k<0||k>=e.rms.length-1)return{open:0,wide:0};
    const a=(e.rms[k]*.6+e.rms[k+1]*.4);return{open:a<.18?0:clamp((a-.15)*1.35),wide:clamp((e.z[k]-.07)*5)}}
  return{open:Math.abs(Math.sin(T*11))*.8,wide:0};
}

/* ---------- characters ---------- */
/* hose arm with a two-finger claw */
function hoseArm(sx,sy,hx,hy,col,sd,claw=true){
  const mx=(sx+hx)/2+vn(BO*.7,sd)*1.5,my=Math.max(sy,hy)+14;
  X.save();X.lineCap='round';X.strokeStyle=INK;X.lineWidth=10;X.beginPath();X.moveTo(sx,sy);X.quadraticCurveTo(mx,my,hx,hy);X.stroke();
  X.strokeStyle=col;X.lineWidth=6;X.stroke();X.restore();
  for(let k=1;k<5;k++){const t=k/5,px=(1-t)*(1-t)*sx+2*(1-t)*t*mx+t*t*hx,py=(1-t)*(1-t)*sy+2*(1-t)*t*my+t*t*hy,tx=2*(1-t)*(mx-sx)+2*t*(hx-mx),ty=2*(1-t)*(my-sy)+2*t*(hy-my),l=Math.hypot(tx,ty)||1;
    ink([[px-ty/l*4.5,py+tx/l*4.5],[px+ty/l*4.5,py-tx/l*4.5]],false,1.2,sd+k*3)}
  if(claw){const a=Math.atan2(hy-my,hx-mx);for(const s of[-1,1]){const p=[];for(let i=0;i<=5;i++){const b=a+s*(.9-i*.3);p.push([hx+Math.cos(a)*3+Math.cos(b)*7,hy+Math.sin(a)*3+Math.sin(b)*7])}ink(p,false,2.2,sd+20+s)}X.fillStyle=INK;C(hx,hy,3)}
}
/* TUERQUITA: scrap robot girl. feet at (x,y). o: look, neck (0..1), arms 'rest'|'wave'|'up'|'point'|'self'|'hold', pt (local target), hop, sq, rust, iris, glow, flip, tilt */
function tuerq(x,y,s,o={}){
  const t=TQ,sd=11,m=o.mouth||mouthOf('g');

  X.translate(0,-(o.hop||0));X.scale(s*(o.flip?-1:1),s);X.rotate(o.tilt||0);

  for(const sx of[-1,1]){const lx=sx*15,pts=[],n=9;for(let i=0;i<=n;i++)pts.push([lx+(i>0&&i<n?(i%2?5.5:-5.5):0),-legH+i/n*(legH-6)]);ink(pts,false,2.3,sd+sx*3);
    const fp=[[lx-13+sx*3,-1],[lx-12+sx*3,-9],[lx-4+sx*3,-12],[lx+6+sx*3,-12],[lx+14+sx*3,-6],[lx+15+sx*3,-1]];base(fp,PAPER);wash(fp,'#8e4e2e',sd+sx);ink(fp,true,2.1,sd+sx*5)}

  whoosh(){const t=now();const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+.6);env(g,t,.15,.35,.6);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+.9)},
  ding(){const t=now();osc('sine',1318.5,t,1.1,.14,sfxBus,.003,1.1);osc('sine',2637,t,.6,.05,sfxBus,.003,.6)},
};
const EVENTS=STORY.events(sfx);

/* ---------- voice (recorded neural clips in window.VOZ, played through Web Audio) ---------- */
let VBUF=[],vSrc=[];
function b64buf(b64){const bin=atob(b64),u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);return u8.buffer}
function loadVoices(){
  if(!AC||!window.VOZ||VBUF.length)return;
  VBUF=window.VOZ.map(()=>null);
  window.VOZ.forEach((b64,i)=>{try{AC.decodeAudioData(b64buf(b64),b=>{VBUF[i]=b;try{analyze(i,b)}catch(_){}},()=>{})}catch(_){}});
}
function playClip(i,offset=0){
  const b=VBUF[i];if(!b||offset>=b.duration)return false;
  const s=AC.createBufferSource();s.buffer=b;s.connect(voiceBus);s.start(AC.currentTime,offset);
  vSrc.push(s);s.onended=()=>{vSrc=vSrc.filter(x=>x!==s)};return true;
}
function stopClips(){vSrc.forEach(s=>{try{s.stop()}catch(_){}});vSrc=[]}
function voiceBusy(){return vSrc.length>0}
function say(L){
  if(!voiceOn||!AC||!window.VOZ)return;
  const tryPlay=n=>{if(!playing||!voiceOn||activeLine()!==L)return;if(VBUF[L.i]){stopClips();playClip(L.i,Math.max(0,T-L.t))}else if(n<12)setTimeout(()=>tryPlay(n+1),150)};
  tryPlay(0);
}
function hush(){stopClips()}
function resumeLineAt(){const L=activeLine();if(L&&voiceOn&&AC&&VBUF[L.i])playClip(L.i,T-L.t)}

/* ---------- player ---------- */
/* The web player chrome is optional: a story can ship only <canvas id="cv">. Missing controls become
   hidden stubs, and clicking the canvas plays/pauses (handy for previewing before rendering). */
const $=id=>document.getElementById(id)||(()=>{const e=document.createElement(id==='seek'?'input':'div');e.id=id;e.hidden=true;document.body.appendChild(e);return e})();
if(!document.getElementById('pp'))cv.addEventListener('click',()=>$('pp').click());
/* pages without the web chrome get a simple centred play button (hidden during export by __begin) */
if(!document.getElementById('bigplay')){
  const b=document.createElement('button');b.id='bigplay';b.setAttribute('aria-label','Ver el cuento');
  b.innerHTML='<svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>';
  b.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.92);color:#1B3A5C;box-shadow:0 10px 30px rgba(0,0,0,.35);display:grid;place-items:center;z-index:5';
  document.body.appendChild(b);
  const c=document.createElement('div');c.id='cover';document.body.appendChild(c);
  new MutationObserver(()=>{b.hidden=c.hidden}).observe(c,{attributes:true});
}
const subs=$('subs'),seek=$('seek'),timeEl=$('time'),cover=$('cover'),endcard=$('endcard');
let subsOn=true,lastLine=null,needResume=false,FIXED=null;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){if(FIXED){if(cv.width!==FIXED[0]||cv.height!==FIXED[1]){cv.width=FIXED[0];cv.height=FIXED[1]}return}const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);const w=Math.max(320,Math.round(r.width*d)),h=Math.round(w*9/16);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
function setPlaying(p){
  playing=p;$('pplabel').textContent=p?'Pausa':'Play';$('pp').setAttribute('aria-label',p?'Pausar':'Reproducir');
  $('ppicon').innerHTML=p?'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>':'<path d="M8 5.5v13l11-6.5z"/>';
  if(AC&&AC.resume){p?AC.resume():AC.suspend()}
  if(p){resync();if(needResume){needResume=false;resumeLineAt()}}
}
function start(){initAudio();started=true;cover.hidden=true;endcard.hidden=true;if(T>=DUR)T=0;resync();setPlaying(true)}
function frame(tm){
  if(window.__offline)return;
  const dt=Math.min(.1,(tm-last)/1000||0);last=tm;
  if(playing){const prev=T;T=Math.min(DUR,T+dt);
    for(const L of LINES)if(L.t>prev&&L.t<=T)say(L);
    if(AC)for(const e of EVENTS)if(e[0]>prev&&e[0]<=T)try{e[1]()}catch(_){}
    schedule();
    if(AC){const tgt=voiceBusy()?.18:.34;musicBus.gain.setTargetAtTime(musicOn?tgt:0,AC.currentTime,.25)}
    if(T>=DUR){setPlaying(false);endcard.hidden=false}
  }
  fit();
  const shown=started?T:4.6;const keep=T;T=shown;render();T=keep;
  const L=started?activeLine():null;
  if(L!==lastLine){lastLine=L;if(L){subs.textContent=L.text;subs.className='subs '+L.who+(subsOn?'':' off')}else subs.className='subs off'}
  seek.value=T;timeEl.textContent=`${fmt(T)} / ${fmt(DUR)}`;

}
$('bigplay').onclick=start;
$('again').onclick=()=>{T=0;start()};
$('pp').onclick=()=>{if(!started){start();return}if(playing)setPlaying(false);else{if(T>=DUR){T=0}endcard.hidden=true;initAudio();resync();setPlaying(true)}};
$('restart').onclick=()=>{hush();T=0;lastLine=null;if(!started)start();else{endcard.hidden=true;resync();setPlaying(true)}};
seek.oninput=()=>{hush();T=parseFloat(seek.value);resync();lastLine=null;if(playing)resumeLineAt();else needResume=true;if(!started){started=true;cover.hidden=true;initAudio();setPlaying(false)}endcard.hidden=T<DUR};
function toggle(btn,get,set){btn.onclick=()=>{set(!get());btn.setAttribute('aria-pressed',String(get()))}}
toggle($('voice'),()=>voiceOn,v=>{voiceOn=v;if(!v)hush()});
toggle($('music'),()=>musicOn,v=>{musicOn=v;if(v)resync()});
toggle($('cc'),()=>subsOn,v=>{subsOn=v;lastLine=undefined});
$('fs').onclick=()=>{const s=$('stage');try{if(document.fullscreenElement)document.exitFullscreen();else s.requestFullscreen&&s.requestFullscreen().catch(()=>{})}catch(_){}};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('pp').click()}});

/* ---------- offline export hooks (used by tools/render.mjs) ---------- */
window.__setT=v=>{T=v};
window.__render=()=>{fit();render()};
window.__lines=()=>LINES.map(L=>({t:L.t,end:L.end,who:L.who,text:L.text}));
/* decode every voice clip and build the lip-sync envelopes before exporting frames (the live player does this on first play) */
window.__prepare=async()=>{if(!window.VOZ)return 0;const A=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,48000,48000);let n=0;
  for(let i=0;i<window.VOZ.length;i++){try{const b=await A.decodeAudioData(b64buf(window.VOZ[i]));analyze(i,b);n++}catch(_){}}return n};
window.__begin=(w,h)=>{window.__offline=true;FIXED=[w,h];started=true;cover.hidden=true;endcard.hidden=true;subs.className='subs off'};
/* one 16:9 frame at story time t, as a JPEG data URL */
window.__frame=(t,q=.92)=>{T=t;fit();render();return cv.toDataURL('image/jpeg',q)};
/* one 9:16 Shorts frame: story frame centered over a blurred copy, big hook on top, captions and CTA below */
let SC=null;
window.__short=(t,local,spec,q=.92)=>{
  T=t;fit();render();
  if(!SC){SC=document.createElement('canvas');SC.width=1080;SC.height=1920}
  const g=SC.getContext('2d');g.setTransform(1,0,0,1,0,0);
  /* soft background: shrink the centre of the frame to a tiny canvas and scale it back up (a cheap blur) */
  if(!SC.sb){SC.sb=document.createElement('canvas');SC.sb.width=36;SC.sb.height=64}
  const cw=cv.height*9/16;SC.sb.getContext('2d').drawImage(cv,(cv.width-cw)/2,0,cw,cv.height,0,0,36,64);
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.filter='saturate(1.2) brightness(.62)';g.drawImage(SC.sb,0,0,1080,1920);g.filter='none';
  const fw=1080,fh=608,fy=660;
  g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=40;g.shadowOffsetY=16;g.fillStyle='#000';g.fillRect(0,fy,fw,fh);g.restore();g.drawImage(cv,0,fy,fw,fh);
  const pop=k=>{const c1=1.9,c3=c1+1,x=Math.min(1,Math.max(0,k));return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
  const txt=(s,x,y,size,fill,font,k,maxW)=>{g.save();g.translate(x,y);const sc=pop(k);g.scale(sc,sc);g.font=`${font.includes('Bagel')?400:700} ${size}px ${font}`;g.textAlign='center';g.textBaseline='middle';
    const words=s.split(' '),lines=[];let cur='';words.forEach(w=>{const tr=cur?cur+' '+w:w;if(g.measureText(tr).width>maxW&&cur){lines.push(cur);cur=w}else cur=tr});lines.push(cur);
    lines.forEach((l,i)=>{const yy=(i-(lines.length-1)/2)*size*1.1;g.lineJoin='round';g.lineWidth=size*.16;g.strokeStyle='rgba(20,8,12,.85)';g.strokeText(l,0,yy);g.fillStyle=fill;g.fillText(l,0,yy)});g.restore()};
  txt(spec.hook,540,330,104,spec.hookColor||'#ffd36b',"'Bagel Fat One',Fredoka,sans-serif",local/.45,960);
  const L=activeLine();if(L)txt(L.text,540,1400,58,L.who==='n'?'#ffffff':(spec.voiceColor||'#bfe9ff'),"Fredoka,sans-serif",1,960);
  txt(spec.cta||'Mira el cuento completo en MitoloKids',540,1640,54,'#ffffff',"Fredoka,sans-serif",(local-(spec.dur||15)+3.2)/.4,940);
  g.fillStyle='rgba(255,255,255,.85)';g.fillRect(0,1906,1080*Math.min(1,local/(spec.dur||15)),14);
  return SC.toDataURL('image/jpeg',q);
};
/* 1280x720 thumbnail: story frame + big two-line title with a paper-cut shadow */
window.__thumb=(t,title,color='#ffd36b')=>{
  T=t;fit();render();const c=document.createElement('canvas');c.width=1280;c.height=720;const g=c.getContext('2d');
  g.drawImage(cv,0,0,1280,720);const gr=g.createLinearGradient(0,0,0,300);gr.addColorStop(0,'rgba(10,4,8,.55)');gr.addColorStop(1,'rgba(10,4,8,0)');g.fillStyle=gr;g.fillRect(0,0,1280,300);
  g.font="400 118px 'Bagel Fat One',Fredoka,sans-serif";g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  title.split('\n').forEach((l,i)=>{const y=110+i*120;g.lineWidth=22;g.strokeStyle='rgba(20,8,12,.9)';g.strokeText(l,640,y);g.fillStyle=i?'#ffffff':color;g.fillText(l,640,y)});
  return c.toDataURL('image/jpeg',.92);
};
/* whole soundtrack (music + sfx + voices, with ducking) rendered offline; resolves to base64 16-bit WAV */
window.__renderAudio=async()=>{
  const SR=48000,len=Math.ceil((DUR+1.5)*SR),off=new OfflineAudioContext(2,len,SR);
  initAudio(off);
  const bufs=await Promise.all((window.VOZ||[]).map(b=>off.decodeAudioData(b64buf(b)).catch(()=>null)));
  for(let n=0;n*EI<DUR;n++)playStep(n,n*EI,n*EI);
  for(const e of EVENTS){OFF_AT=e[0];try{e[1]()}catch(_){}}OFF_AT=null;
  musicBus.gain.setValueAtTime(.34,0);
  LINES.forEach(L=>{const b=bufs[L.i];if(!b)return;const s=off.createBufferSource();s.buffer=b;s.connect(voiceBus);s.start(L.t);musicBus.gain.setTargetAtTime(.18,L.t,.25);musicBus.gain.setTargetAtTime(.34,L.t+b.duration,.25)});
  const out=await off.startRendering();
  const ch=[out.getChannelData(0),out.getChannelData(1)],n=out.length,buf=new ArrayBuffer(44+n*4),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,SR,true);v.setUint32(28,SR*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*4,true);
  let o=44;for(let i=0;i<n;i++)for(let c=0;c<2;c++){const x=Math.max(-1,Math.min(1,ch[c][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
  const u8=new Uint8Array(buf);let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
  AC=null;return btoa(s);
};
requestAnimationFrame(frame);

})();
</script>
