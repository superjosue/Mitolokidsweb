<!--
  PROMETEO Y EL REGALO DEL FUEGO  (Mitolokids 09 · video 06) — estilo base del canal "Acuarela geométrica viva"
  (docs/estilo-base.md) adaptado a los "dos mundos" del libro:
    ORDEN (Olimpo, dioses, Zeus, reglas, "Hoy sabemos") = PLANO / BLUEPRINT: papel azul Prusia, líneas de regla,
      círculos de compás, marcas de centro, lápiz azul pálido y dorado; los dioses se construyen con geometría.
    VIDA (personas, tierra, cueva, Prometeo modelando) = acuarela cálida orgánica con lápiz que "hierve".
    El FUEGO es el puente: una llama de acuarela con luz pintada que baja del plano frío y lo calienta.
  Paleta (biblia): Prusia #1B3A5C · cianotipo #2E5E8C · crema #F3E9D2 · terracota #C8643B · ocre #D9A441 ·
    salvia #7E9A7A · carbón #2B2A2E · kraft #B08A5B; lápiz blueprint #a9c9ff, oro #e8c26a.
  Técnica: 5–6 planos pintados cacheados por escena (need/dl), acuarela con grano, gubia en roca, luz pintada
    (sprites de halo), personajes con articulaciones visibles sobre engine/rig.js, poses a 15 dibujos/s,
    capa BP (engine/blueprint.js): compases y plomadas del Olimpo, cotas del titán, pasos de puntitas y la
    ruta de la chispa con puntos a tiempos iguales, ondas de calor.
  Tipografía: Andika (serie). Momento estrella: ¡FUUUSH! la chispa crece y la acuarela cálida inunda la cueva fría.
  Mito (lechucita azul, anillos dorados, pico terracota, estrella dorada) se esconde en cada escena.
-->

/* ---------- blueprint layer (shared); on the dark blueprint paper the pencil is a lighter blue ---------- */
/* ==========================================================================
   Blueprint layer: the channel's signature auxiliary motion lines.
   Include with  /*@@INCLUDE blueprint@@*\/ . Uses the story's ctx and T.

   Thin technical-drawing guides that reveal the motion and the physics:
   dashed arcs with tick marks along a limb sweep, plumb lines, breathing rings,
   trajectories with equal-time ticks, pivot crosses, dimension lines, compass
   circles. Drawn in "non-photo blue" pencil at low opacity; each guide draws
   itself in (a pencil tracing it), stays while the action happens, then fades.

   Style constants
     BP.ink  '#5f8fca' (blue pencil)   BP.red '#c8574f' (accent / key moment)
   Every function takes an optional o = {alpha, color, width, dash, reveal}
     reveal 0..1 = how much of the guide is drawn (use BP.life(t0,t1,T) for in/hold/out)
   ========================================================================== */
const BP=(()=>{
  const ink='#5f8fca',red='#c8574f';
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  /* life curve for a guide shown from t0 to t1: draws in over 0.6 s, holds, fades out over 0.6 s -> {reveal, alpha} */
  function life(t0,t1,t=T,fade=.6){const r=clamp((t-t0)/fade),a=clamp((t1-t)/fade);return {reveal:r*r*(3-2*r),alpha:Math.min(1,r*1.5)*a}}
  function pen(o={}){ctx.strokeStyle=o.color||ink;ctx.globalAlpha*=(o.alpha??1)*(o.opacity??.75);ctx.lineWidth=o.width||1.6;ctx.lineCap='round';ctx.setLineDash(o.dash||[])}
  /* dashed arc around a pivot, from angle a0 to a1 (radians), with tick marks and an arrow head at the leading end */
  function arc(cx,cy,r,a0,a1,o={}){
    const rv=o.reveal??1;if(rv<=0)return;const a=a0+(a1-a0)*rv;
    ctx.save();pen({dash:[6,6],...o});ctx.beginPath();ctx.arc(cx,cy,r,a0,a,a<a0);ctx.stroke();ctx.setLineDash([]);
    const n=o.ticks??8;for(let i=0;i<=n;i++){const u=a0+(a1-a0)*i/n;if((a1>a0&&u>a)||(a1<a0&&u<a))break;const k=i%4===0?9:5;
      ctx.beginPath();ctx.moveTo(cx+Math.cos(u)*(r-k/2),cy+Math.sin(u)*(r-k/2));ctx.lineTo(cx+Math.cos(u)*(r+k/2),cy+Math.sin(u)*(r+k/2));ctx.stroke()}
    if(o.arrow!==false&&rv>.15){const s=Math.sign(a1-a0),tx=-Math.sin(a)*s,ty=Math.cos(a)*s,px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
      ctx.beginPath();ctx.moveTo(px-tx*10+ty*5,py-ty*10-tx*5);ctx.lineTo(px,py);ctx.lineTo(px-tx*10-ty*5,py-ty*10+tx*5);ctx.stroke()}
    ctx.restore()}
  /* plumb line through (x, y0..y1) with a bob, plus a centre-of-mass dot that can wobble (dx) and settle */
  function plumb(x,y0,y1,dx=0,o={}){
    const rv=o.reveal??1;if(rv<=0)return;ctx.save();pen({dash:[3,5],...o});const yb=y0+(y1-y0)*rv;
    ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,yb);ctx.stroke();ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(x-6,yb-9);ctx.lineTo(x,yb);ctx.lineTo(x+6,yb-9);ctx.closePath();ctx.stroke();
    if(o.com){const[cx,cy]=o.com;ctx.beginPath();ctx.arc(cx+dx,cy,6,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+dx-10,cy);ctx.lineTo(cx+dx+10,cy);ctx.moveTo(cx+dx,cy-10);ctx.lineTo(cx+dx,cy+10);ctx.stroke()}
    ctx.restore()}
  /* breathing ring: smooth radius between rMin and rMax from a phase 0..1 (0 = empty lungs, 0.5 = full);
     cosine curve with soft holds at top and bottom, so there is never a pop. Dashed rings mark min and max. */
  function breathR(phase,rMin,rMax,hold=.12){const p=((phase%1)+1)%1,h=hold/2;let u;
    if(p<h)u=0;else if(p<.5-h)u=(p-h)/(.5-2*h);else if(p<.5+h)u=1;else if(p<1-h)u=1-(p-.5-h)/(.5-2*h);else u=0;
    return rMin+(rMax-rMin)*(.5-.5*Math.cos(Math.PI*u))}
  function ring(cx,cy,r,rMin,rMax,o={}){
    ctx.save();pen({dash:[4,6],opacity:.45,...o});for(const q of[rMin,rMax]){ctx.beginPath();ctx.arc(cx,cy,q,0,Math.PI*2);ctx.stroke()}
    ctx.setLineDash([]);ctx.globalAlpha=(o.alpha??1)*.85;ctx.lineWidth=o.width||2.2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
    for(let i=0;i<24;i++){const a=i/24*Math.PI*2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(rMax-4),cy+Math.sin(a)*(rMax-4));ctx.lineTo(cx+Math.cos(a)*(rMax+4),cy+Math.sin(a)*(rMax+4));ctx.stroke()}
    ctx.restore()}
  /* trajectory: points sampled at EQUAL time steps (so spacing shows speed/acceleration), drawn as a dashed path with tick dots */
  function path(pts,o={}){
    const rv=o.reveal??1;if(rv<=0||pts.length<2)return;const n=Math.max(2,Math.round(pts.length*rv));ctx.save();pen({dash:[5,6],...o});
    ctx.beginPath();for(let i=0;i<n;i++){const p=pts[i];i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=o.color||ink;for(let i=0;i<n;i+=o.every||1){ctx.beginPath();ctx.arc(pts[i][0],pts[i][1],2.4,0,Math.PI*2);ctx.fill()}
    ctx.restore()}
  /* force / velocity vector with a label (e.g. "g") */
  function vector(x,y,dx,dy,label,o={}){
    const rv=o.reveal??1;if(rv<=0)return;ctx.save();pen({opacity:.85,color:o.color||red,...o});const ex=x+dx*rv,ey=y+dy*rv,a=Math.atan2(dy,dx);
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(ex,ey);ctx.stroke();ctx.beginPath();ctx.moveTo(ex-Math.cos(a-.4)*11,ey-Math.sin(a-.4)*11);ctx.lineTo(ex,ey);ctx.lineTo(ex-Math.cos(a+.4)*11,ey-Math.sin(a+.4)*11);ctx.stroke();
    if(label){ctx.fillStyle=o.color||red;ctx.font=`italic ${o.size||18}px Georgia,serif`;ctx.fillText(label,ex+8,ey+4)}ctx.restore()}
  /* pivot cross (joint / rotation centre) */
  function pivot(x,y,s=8,o={}){ctx.save();pen(o);ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x+s,y);ctx.moveTo(x,y-s);ctx.lineTo(x,y+s);ctx.stroke();ctx.beginPath();ctx.arc(x,y,s*.55,0,Math.PI*2);ctx.stroke();ctx.restore()}
  /* dimension line between two points with end bars and optional text */
  function dim(x0,y0,x1,y1,text,o={}){
    ctx.save();pen(o);const a=Math.atan2(y1-y0,x1-x0),nx=-Math.sin(a)*7,ny=Math.cos(a)*7;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.moveTo(x0-nx,y0-ny);ctx.lineTo(x0+nx,y0+ny);ctx.moveTo(x1-nx,y1-ny);ctx.lineTo(x1+nx,y1+ny);ctx.stroke();
    if(text){ctx.fillStyle=o.color||ink;ctx.font=`${o.size||15}px Georgia,serif`;ctx.textAlign='center';ctx.fillText(text,(x0+x1)/2-nx*1.6,(y0+y1)/2-ny*1.6)}ctx.restore()}
  /* compass construction circle with a centre mark and a radius line */
  function compass(cx,cy,r,o={}){
    const rv=o.reveal??1;if(rv<=0)return;ctx.save();pen({opacity:.4,...o});ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*rv);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(-Math.PI/2+Math.PI*2*rv)*r,cy+Math.sin(-Math.PI/2+Math.PI*2*rv)*r);ctx.stroke();pivot(cx,cy,5,o);ctx.restore()}
  /* concentric ripple rings (water, sound, a landing) spreading from a point over time dt */
  function ripple(cx,cy,dt,o={}){if(dt<0)return;ctx.save();for(let i=0;i<(o.count||3);i++){const k=dt-i*.25;if(k<0)continue;const r=(o.speed||90)*k,al=clamp(1-k/(o.life||1.6));
    pen({alpha:al,dash:[4,6],...o});ctx.beginPath();ctx.ellipse(cx,cy,r,r*(o.squash||.35),0,0,Math.PI*2);ctx.stroke()}ctx.restore()}
  return {ink,red,life,arc,plumb,breathR,ring,path,vector,pivot,dim,compass,ripple};
})();

[['arc',5],['plumb',4],['path',1],['pivot',3],['dim',5],['compass',3],['ripple',3]].forEach(([k,i])=>{const f=BP[k];BP[k]=(...a)=>{a[i]=Object.assign({color:BPB},a[i]||{});return f(...a)}});

/* ---------- hand-made texture kit (builders run once into cached layers) ---------- */
const RS=1.5;
function mk(w,h,rs=RS){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*rs));c.height=Math.max(1,Math.ceil(h*rs));const g=c.getContext('2d',{willReadFrequently:true});g.setTransform(rs,0,0,rs,0,0);g.lineCap='round';g.lineJoin='round';return[c,g]}
let GRAINC=null,PAPERC=null,GP=null;const GLOW={};
function makeGrain(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d',{willReadFrequently:true}),id=g.createImageData(256,256),r=rnd(77);
  for(let i=0;i<65536;i++){let v=228+r()*27;if(r()<.03)v-=40*r();id.data[i*4]=v;id.data[i*4+1]=v-3;id.data[i*4+2]=v-9;id.data[i*4+3]=255}
  g.putImageData(id,0,0);for(let k=0;k<260;k++){g.fillStyle=`rgba(80,60,40,${.05+r()*.08})`;g.beginPath();g.arc(r()*256,r()*256,.5+r()*1.4,0,TAU);g.fill()}return c}
function makePaper(){const c=document.createElement('canvas');c.width=1920;c.height=1080;const g=c.getContext('2d',{willReadFrequently:true}),r=rnd(5);
  g.fillStyle='#fbf4e4';g.fillRect(0,0,1920,1080);g.globalAlpha=.6;g.fillStyle=g.createPattern(GRAINC,'repeat');g.fillRect(0,0,1920,1080);g.globalAlpha=1;
  for(let k=0;k<700;k++){const x=r()*1920,y=r()*1080,a=r()*TAU,l=6+r()*22;g.strokeStyle=`rgba(120,92,60,${.05+r()*.07})`;g.lineWidth=.6+r()*.8;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a)*l*.5+(r()-.5)*6,y+Math.sin(a)*l*.5+(r()-.5)*6,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
  const vg=g.createRadialGradient(960,540,400,960,540,1150);vg.addColorStop(0,'rgba(255,255,255,0)');vg.addColorStop(1,'rgba(40,30,50,.55)');g.fillStyle=vg;g.fillRect(0,0,1920,1080);return c}
function makeGlow(name,stops){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d',{willReadFrequently:true}),rg=g.createRadialGradient(64,64,0,64,64,64);stops.forEach(([o,s])=>rg.addColorStop(o,s));g.fillStyle=rg;g.fillRect(0,0,128,128);GLOW[name]=c}
function glow(name,x,y,r,a=1){if(a<=0||r<=0)return;ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.min(1,a);ctx.drawImage(GLOW[name],x-r,y-r,r*2,r*2);ctx.restore()}
function pathS(g,p,closed){const n=p.length;g.beginPath();
  if(closed){g.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}g.closePath()}
  else{g.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const a=p[i],b=p[i+1];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}g.lineTo(p[n-1][0],p[n-1][1])}}
function blob(cx,cy,rx,ry,n,r,irr=.12,rot=0){const p=[];for(let i=0;i<n;i++){const a=i/n*TAU+rot,k=1+(r()-.5)*2*irr;p.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k])}return p}
function arcP(cx,cy,rx,ry,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);p.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}return p}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){x0=Math.min(x0,q[0]);y0=Math.min(y0,q[1]);x1=Math.max(x1,q[0]);y1=Math.max(y1,q[1])}return[x0,y0,x1,y1]}
function rectPts(x,y,w,h,st=24){const p=[];for(let i=0;i<=w;i+=st)p.push([x+i,y]);for(let i=0;i<=h;i+=st)p.push([x+w,y+i]);for(let i=w;i>=0;i-=st)p.push([x+i,y+h]);for(let i=h;i>=0;i-=st)p.push([x,y+i]);return p}
/* graphite line: jittery passes, overshooting ends; live calls pass a BQ()-based seed so the line "boils" */
function pencil(g,p,seed,o={}){const r=rnd(seed),w=o.w??1.2,a=o.a??.5,j=o.j??1.3,passes=o.passes??2,ga=g.globalAlpha;
  g.save();g.strokeStyle=o.col??GR;g.lineCap='round';g.lineJoin='round';
  for(let k=0;k<passes;k++){let q=p.map(v=>[v[0]+(r()-.5)*2*j,v[1]+(r()-.5)*2*j]);
    if(o.closed){const n=q.length,s=Math.floor(r()*n),ov=Math.max(2,Math.round(n*(.06+r()*.1))),qq=[];for(let i=0;i<n+ov;i++){const v=q[(s+i)%n];qq.push(i>=n?[v[0]+(r()-.5)*j*3,v[1]+(r()-.5)*j*3]:v)}q=qq}
    else if(q.length>1){const e=(A,B)=>{const dx=A[0]-B[0],dy=A[1]-B[1],l=Math.hypot(dx,dy)||1,s=(o.over??5)*(.4+r());return[A[0]+dx/l*s,A[1]+dy/l*s]};q=[e(q[0],q[1]),...q,e(q[q.length-1],q[q.length-2])]}
    g.globalAlpha=ga*a*(k?.55:1);g.lineWidth=w*(k?.6:1);pathS(g,q,false);g.stroke()}
  g.restore()}
/* linocut gouge: a filled sliver, pointed at both ends (mode 0) or blunt start / sharp end (mode 1) */
function taper(g,p,w,col,mode=0){const n=p.length;if(n<2)return;const L=[],R=[];
  for(let i=0;i<n;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const u=i/(n-1);
    const hw=w*.5*(mode?Math.pow(1-u,.7)*Math.min(1,u*6+.3):Math.pow(Math.sin(PI*u),.7))+.12;L.push([p[i][0]-dy*hw,p[i][1]+dx*hw]);R.push([p[i][0]+dy*hw,p[i][1]-dx*hw])}

/* watercolor fill: flat wash + soft blooms + painted light + pooled darker edge + paper granulation */
function wash(g,p,col,seed,o={}){const r=rnd(seed),[x0,y0,x1,y1]=bbox(p),bw=x1-x0,bh=y1-y0;
  g.save();pathS(g,p,true);g.fillStyle=col;g.fill();g.clip();
  if(o.light!==false){const lg=g.createLinearGradient(x0,y0,x0+bw*.35,y1);lg.addColorStop(0,rgba('#fff4d6',o.lt??.22));lg.addColorStop(.55,'rgba(255,244,214,0)');lg.addColorStop(1,rgba(o.dkc??'#0c1424',o.dk??.18));g.fillStyle=lg;g.fillRect(x0,y0,bw,bh)}
  g.filter=`blur(${o.blur??7}px)`;
  for(let k=0;k<(o.blooms??5);k++){g.fillStyle=rgba(mixc(col,r()<.5?'#fff6dc':(o.dkc??'#0c1424'),.08+r()*.14),.5);g.beginPath();g.ellipse(x0+r()*bw,y0+r()*bh,Math.max(4,bw*(.1+r()*.25)),Math.max(4,bh*(.1+r()*.25)),r()*3,0,TAU);g.fill()}
  g.filter='blur(1.6px)';g.strokeStyle=rgba(mixc(col,'#0c1018',.45),o.edgeA??.6);g.lineWidth=o.edge??3.5;pathS(g,p,true);g.stroke();
  g.filter='none';g.globalCompositeOperation='multiply';g.globalAlpha=o.grain??.5;g.fillStyle=g.createPattern(GRAINC,'repeat');g.fillRect(x0,y0,bw,bh);
  g.restore()}

/* ---------- depth planes: each scene builds its painted layers once (seeded); older scenes are evicted ---------- */
const M=80;let CUR=null,LAY={};
/* def = [name, parallax, painter, resScale?, box?]  (box = [x0,y0,w,h] in scene units, default the frame + margin) */
function need(name,defs){if(CUR===name)return;LAY={};CUR=name;for(const[n,p,fn,rs,box]of defs){const b=box||[-M,-M,W+2*M,H+2*M],[c,g]=mk(b[2],b[3],rs??RS);g.translate(-b[0],-b[1]);fn(g);LAY[n]={c,p,b}}}
const CAM={x:0,y:0,z:1};
function camT(p){const z=1+(CAM.z-1)*p;ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2-CAM.x*p,-H/2-CAM.y*p)}
function dl(n,o={}){const L=LAY[n];if(!L)return;ctx.save();if(o.alpha!=null)ctx.globalAlpha=o.alpha;if(o.op)ctx.globalCompositeOperation=o.op;camT(L.p);ctx.drawImage(L.c,L.b[0]+(o.dx||0),L.b[1]+(o.dy||0),L.b[2],L.b[3]);ctx.restore()}
function at(p,fn){ctx.save();camT(p);fn();ctx.restore()}

/* ---------- ORDEN kit: drafting on blueprint paper (ruler lines, compass circles, centre marks) ---------- */
/* blueprint sheet: Prussian wash, cyanotype blooms, fine drafting grid, grain */
function bpSheet(g,x0,y0,w,h,o={}){const r=rnd(o.seed||3),lg=g.createLinearGradient(0,y0,0,y0+h);(o.stops||['#16304f','#1d3d62','#244a73']).forEach((c,i,a)=>lg.addColorStop(i/(a.length-1),c));g.fillStyle=lg;g.fillRect(x0,y0,w,h);
  g.save();g.filter='blur(30px)';for(let k=0;k<16;k++){g.fillStyle=r()<.5?'rgba(80,130,190,.22)':'rgba(8,16,34,.3)';g.beginPath();g.ellipse(x0+r()*w,y0+r()*h,90+r()*220,40+r()*110,r()*3,0,TAU);g.fill()}g.restore();
  const gs=o.grid??40;if(gs){g.save();g.strokeStyle='rgba(169,201,255,.09)';g.lineWidth=.8;for(let x=Math.floor(x0/gs)*gs;x<x0+w;x+=gs){g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+h);g.stroke()}for(let y=Math.floor(y0/gs)*gs;y<y0+h;y+=gs){g.beginPath();g.moveTo(x0,y);g.lineTo(x0+w,y);g.stroke()}
    g.strokeStyle='rgba(169,201,255,.15)';for(let x=Math.floor(x0/(gs*5))*gs*5;x<x0+w;x+=gs*5){g.beginPath();g.moveTo(x,y0);g.lineTo(x,y0+h);g.stroke()}g.restore()}
  g.save();g.globalCompositeOperation='multiply';g.globalAlpha=.5;g.fillStyle=g.createPattern(GRAINC,'repeat');g.fillRect(x0,y0,w,h);g.restore()}
/* ruler line: two crisp passes, the ends run past the corner like a draughtsman's line */
function rul(g,a,b,seed,o={}){pencil(g,[a,b],seed,{col:o.col??BPB,w:o.w??1.3,a:o.a??.7,j:o.j??.35,over:o.over??9,passes:o.passes??2})}
/* compass circle: arc with an overlap, centre cross (pivot) and a faint radius */
function cmp(g,cx,cy,r,seed,o={}){const rr=rnd(seed),a0=rr()*TAU;pencil(g,arcP(cx,cy,r,r,a0,a0+TAU*1.04,Math.max(16,Math.round(r/5))),seed,{col:o.col??BPB,w:o.w??1.1,a:o.a??.5,j:o.j??.4,passes:1,over:0});
  if(o.mark!==false){const s=o.ms??6;rul(g,[cx-s,cy],[cx+s,cy],seed+1,{col:o.col,a:(o.a??.5)*.9,over:1,passes:1});rul(g,[cx,cy-s],[cx,cy+s],seed+2,{col:o.col,a:(o.a??.5)*.9,over:1,passes:1})}}
/* flat, exact ORDEN fill: a clean wash (no blooms) + grain, used for gods and architecture */
function flat(g,draw,col,o={}){g.save();draw(g);g.fillStyle=col;g.globalAlpha=o.a??1;g.fill();if(o.grain!==false){g.globalCompositeOperation='multiply';g.globalAlpha=.35;g.fillStyle=GP;g.fill()}g.restore()}
function polyP(g,p){g.beginPath();p.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath()}
function circP(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU)}
/* Greek meander, ruler-drawn */

/* ---------- the fire: watercolor flame (VIDA) + painted light; the spark is a perfect gold triangle (ORDEN) ---------- */

function spark(x,y,r,rot=0,o={}){if(r<.5)return;glow('fire',x,y,r*(o.halo??5),o.ga??.9);glow('soft',x,y,r*2.2,.8);

  rul(ctx,a,b,40+BQ(),{col:'#b8862a',w:1.1,a:.8,over:r*.35,passes:1});rul(ctx,b,c,41+BQ(),{col:'#b8862a',w:1.1,a:.8,over:r*.35,passes:1});rul(ctx,c,a,42+BQ(),{col:'#b8862a',w:1.1,a:.8,over:r*.35,passes:1});
  if(o.secret){const u=r*.14;ctx.lineCap='round';ctx.lineWidth=Math.max(1,u*.45);   /* secret: the corners carry the three friends of fire */
    ctx.strokeStyle='#6f9fd8';ctx.beginPath();ctx.arc(a[0]+u*1.8,a[1]+u*2.4,u,PI,TAU*.95);ctx.stroke();
    ctx.strokeStyle='#8a5a30';ctx.beginPath();ctx.moveTo(b[0]+u*1.2,b[1]-u*1.2);ctx.lineTo(b[0]+u*3.2,b[1]-u*1.6);ctx.stroke();
    ctx.fillStyle=PAL.terracota;polyP(ctx,[[c[0]-u*3.2,c[1]-u*.8],[c[0]-u*1.6,c[1]-u*.8],[c[0]-u*2.4,c[1]-u*2.6]]);ctx.fill()}
  ctx.restore()}

/* ---------- Mito, house style: watercolor body + boiling pencil, geometric googly eyes (the bridge) ---------- */
let MB=null,MW=null;
function sprite(x0,y0,w,h,fn,rs=RS){const[c,g]=mk(w,h,rs);g.translate(-x0,-y0);fn(g);return{c,x:x0,y:y0,w,h}}

    for(let i=0;i<5;i++){const bx=-18+(i%3)*18,by=18+Math.floor(i/3)*18+(i%3===1?-6:0);taper(g,arcP(bx,by,6,6,.15*PI,.85*PI,6),2.4,'rgba(176,138,91,.8)')}
    for(let k=0;k<7;k++){const a=-PI*.8+k*.22;taper(g,arcP(0,-6,48,58,a,a+.3,5),2,'rgba(190,215,245,.35)')}

  MW=sprite(-30,-26,60,90,g=>{const p=blob(0,18,21,39,16,rnd(921),.04);wash(g,p,'#26507a',922,{blur:3,blooms:2,edge:2.5,lt:.3});for(let k=0;k<3;k++)taper(g,[[-8+k*8,40],[-6+k*8,54]],2,'rgba(190,215,245,.4)')},2.5)}

  const br={neutral:[0,0],up:[-.18,-6],worried:[.35,-2],angry:[-.4,2],surprised:[0,-10]}[o.brows||'neutral'];
  for(const d of[-1,1]){ctx.save();ctx.translate(d*24,-56+br[1]);ctx.rotate(d*br[0]);ctx.fillStyle='#fbf7ee';ctx.fillRect(-15,-3.5,30,7);ctx.strokeStyle='rgba(43,42,46,.35)';ctx.lineWidth=1;ctx.strokeRect(-15,-3.5,30,7);ctx.restore()}

  if(open>.05){ctx.fillStyle='#8e3e22';polyP(ctx,[[-6,-6+open*2],[6,-6+open*2],[0,6+open*12]]);ctx.fill()}
  if(o.cover){for(const d of[-1,1]){ctx.save();ctx.translate(d*22,-34);ctx.rotate(d*.9);ctx.scale(-d,1);ctx.drawImage(MW.c,MW.x,MW.y,MW.w,MW.h);ctx.restore()}}
  ctx.restore()}

/* ---------- lettering: kinetic paper letters (onomatopoeias) and paper tags ---------- */
function kinetic(str,x,y,t0,o={}){const t=T-t0,dur=o.dur??2.6;if(t<0||t>dur+.45)return;
  const size=o.size||86,gap=o.gap??.06,seed=o.seed||1,r=rnd(seed);
  ctx.save();ctx.font=`700 ${size}px ${FONT}`;ctx.textBaseline='middle';ctx.textAlign='center';
  const ch=[...str],ws=ch.map(c=>ctx.measureText(c).width+(o.track??3)),tot=ws.reduce((a,b)=>a+b,0);let cx=x-tot/2;const out=eo(inv(dur,dur+.45,t));

      ctx.translate(cx+w/2+(o.shake?Math.cos(T*53+i)*o.shake:0),y+dy);ctx.rotate(rot+Math.sin(BQ()*1.7+i)*.02);ctx.scale(sc,sc);
      ctx.fillStyle='rgba(10,14,30,.35)';ctx.fillText(c,3,5);ctx.lineJoin='round';ctx.lineWidth=size*.18;ctx.strokeStyle=o.rim||'#fbf4e4';ctx.strokeText(c,0,0);ctx.fillStyle=o.col||PAL.ocre;ctx.fillText(c,0,0);ctx.restore()}}

const TAGS={};
function tagC(text,size,col,ink=GR){const key=text+size+col+(document.fonts?document.fonts.status:'');if(TAGS[key])return TAGS[key];
  const m=document.createElement('canvas').getContext('2d');m.font=`700 ${size}px ${FONT}`;const tw=m.measureText(text).width,w=tw+size*1.2,h=size*1.6,r=rnd(text.length*31+size);
  const[c,g]=mk(w+16,h+16,2);g.translate(8,8);const p=[];for(let i=0;i<=10;i++)p.push([w*i/10,(r()-.5)*2.5]);for(let i=0;i<=5;i++)p.push([w+(r()-.5)*2.5,h*i/5]);for(let i=10;i>=0;i--)p.push([w*i/10,h+(r()-.5)*2.5]);for(let i=5;i>=0;i--)p.push([(r()-.5)*2.5,h*i/5]);
  g.fillStyle='rgba(0,0,10,.3)';polyP(g,p.map(q=>[q[0]+3,q[1]+4]));g.fill();polyP(g,p);g.fillStyle=col;g.fill();
  g.save();g.clip();g.globalCompositeOperation='multiply';g.fillStyle=g.createPattern(GRAINC,'repeat');g.fillRect(0,0,w,h);g.restore();
  g.strokeStyle=rgba(GR,.5);g.lineWidth=1.2;polyP(g,p);g.stroke();g.font=`700 ${size}px ${FONT}`;g.fillStyle=ink;g.textAlign='center';g.textBaseline='middle';g.fillText(text,w/2,h*.54);
  return TAGS[key]={c,w:w+16,h:h+16}}
function tag(x,y,text,k,col='#f3e9d2',rot=-.03,size=26,ink=GR){if(k<=0)return;const C=tagC(text,size,col,ink);ctx.save();ctx.translate(x,y);ctx.rotate(rot+Math.sin(T*1.3+x)*.012);const s=eob(clamp(k));ctx.scale(s,s);ctx.globalAlpha*=clamp(k*3);ctx.drawImage(C.c,-C.w/2,-C.h/2,C.w,C.h);ctx.restore()}

/* ---------- limbs with visible hinge joints (people and Prometeo), over engine/rig.js ---------- */
/* ==========================================================================
   Shared 2D humanoid rig (forward kinematics) + pose library.
   Include in a story with the marker  /*@@INCLUDE rig@@*\/  (tools/build.mjs inlines it).

   Skeleton, lengths in "body heights" (child proportions, H = 1):
     pelvis(root) -> lumbar -> thorax -> neck -> head
     thorax end = shoulders -> upperArm -> foreArm (+hand)
     pelvis = hips -> thigh -> shin -> foot
   A pose stores WORLD angles in degrees for every bone (0 = screen right, 90 = down,
   -90 = up), a root offset (pelvis relative to the ground point, in body heights) and
   a view: 'front' (limbs split left/right) or 'side' (facing screen-left; limbs overlap,
   'L' = near side, 'R' = far side).  In front view 'L' is the limb on the SCREEN LEFT.
   The pose library is kid-safe yoga; all poses were authored to be imitable.

   API
     RIG.pose(name) -> pose object            RIG.names -> list of pose names
     RIG.blend(a, b, t) -> pose (eased angle lerp; if views differ, t<.5 shows a, else b,
                           and .turn (0..1) says how "edge-on" the body is, for a turn squash)
     RIG.joints(pose, x, y, h, dir=1) -> named points in pixels (ground point x,y; body height h;
                           dir=-1 mirrors horizontally) + .radius for the head
     RIG.breathe(pose, amount) -> pose with chest/arms lifted a little (amount 0..1)
     RIG.debug(ctx, J, color) -> thin construction skeleton (circles + lines), for subtle geometry
     RIG.mirror(pose) -> the same pose on the other side;  RIG.via(a, mid, b, t) -> blend a→mid→b (safe arm paths)
     pose.mouth === 'roar' asks the story to draw an open mouth (lion breath)
   ========================================================================== */
const RIG=(()=>{
  const L={lumbar:.16,thorax:.19,neck:.05,head:.105,upper:.15,fore:.14,hand:.035,thigh:.21,shin:.21,foot:.065,shoulder:.085,hip:.055};
  const B=['lumbar','thorax','neck','head','uArmL','fArmL','uArmR','fArmR','thighL','shinL','footL','thighR','shinR','footR'];
  const D=(o)=>Object.assign({lumbar:-90,thorax:-90,neck:-90,head:0,uArmL:100,fArmL:95,uArmR:80,fArmR:85,thighL:93,shinL:90,footL:112,thighR:87,shinR:90,footR:68,root:[0,-.42],view:'front'},o);
  const P={
    /* standing, arms relaxed */
    montana:D({}),
    /* standing tall, arms stretched up */
    montanaArriba:D({uArmL:-100,fArmL:-95,uArmR:-80,fArmR:-85,root:[0,-.43]}),
    /* tree: stand on screen-left leg, right foot on the left CALF (never the knee), palms together above head */
    arbol:D({thighL:90,shinL:90,thighR:55,shinR:150,footR:180,uArmL:-110,fArmL:-55,uArmR:-70,fArmR:-125,root:[0,-.42]}),
    /* flamingo: balance on one leg, other knee lifted forward, arms open like wings */
    flamenco:D({thighL:90,shinL:90,thighR:40,shinR:100,footR:20,uArmL:185,fArmL:170,uArmR:-5,fArmR:10,root:[0,-.42]}),
    /* frog: deep squat, knees wide, palms together at the chest (elbows gently open the knees) */
    rana:D({lumbar:-80,thorax:-95,thighL:165,shinL:100,thighR:15,shinR:80,footL:128,footR:52,uArmL:112,fArmL:-36,uArmR:68,fArmR:216,root:[0,-.2]}),
    /* butterfly: seated, soles together, knees out, hands holding the feet */
    mariposa:D({thighL:165,shinL:25,thighR:15,shinR:155,footL:0,footR:180,uArmL:112,fArmL:60,uArmR:68,fArmR:120,root:[0,-.07]}),
    /* seated cross-legged for breathing */
    sentado:D({thighL:170,shinL:20,thighR:10,shinR:160,footL:0,footR:180,uArmL:108,fArmL:40,uArmR:72,fArmR:140,root:[0,-.07]}),
    /* warrior II: wide stance, front knee bent over the ankle, arms long to the sides, gaze over the front hand */
    guerrero:D({thighL:130,shinL:92,thighR:62,shinR:62,footL:170,footR:75,uArmL:180,fArmL:180,uArmR:0,fArmR:0,head:0,root:[0,-.33]}),
    /* lion breath: kneeling tall on the heels, hands on the knees, mouth wide open (story draws tongue + roar) */
    leon:D({thighL:100,shinL:5,thighR:80,shinR:175,footL:0,footR:180,uArmL:108,fArmL:80,uArmR:72,fArmR:100,root:[0,-.22],mouth:'roar'}),
    /* side-view poses (character faces screen-left) */
    /* boat: seated, lean back a little, knees bent and shins lifted, arms reaching forward */
    barco:D({view:'side',lumbar:-68,thorax:-74,neck:-85,head:0,uArmL:185,fArmL:180,uArmR:183,fArmR:180,thighL:-140,shinL:180,thighR:-138,shinR:182,footL:250,footR:250,root:[.03,-.07]}),
    perfil:D({view:'side',uArmL:95,fArmL:92,uArmR:85,fArmR:88,thighL:92,shinL:90,thighR:88,shinR:90,footL:180,footR:180}),
    /* cat: on hands and knees, back rounded UP */
    gato:D({view:'side',lumbar:195,thorax:165,neck:150,head:20,uArmL:90,fArmL:90,uArmR:92,fArmR:90,thighL:90,shinL:0,thighR:92,shinR:0,footL:0,footR:0,root:[.2,-.24]}),
    /* cow: on hands and knees, back gently dipped, chin up */
    vaca:D({view:'side',lumbar:170,thorax:190,neck:220,head:-20,uArmL:90,fArmL:90,uArmR:92,fArmR:90,thighL:90,shinL:0,thighR:92,shinR:0,footL:0,footR:0,root:[.2,-.24]}),
    /* downward dog: hips high, an upside-down V */
    perrito:D({view:'side',lumbar:142,thorax:142,neck:118,head:40,uArmL:118,fArmL:118,uArmR:120,fArmR:120,thighL:72,shinL:74,thighR:70,shinR:72,footL:180,footR:180,root:[.12,-.5]}),
    /* baby cobra: lying on the belly, small chest lift, hands under the shoulders */
    cobra:D({view:'side',lumbar:185,thorax:205,neck:230,head:-10,uArmL:95,fArmL:15,uArmR:97,fArmR:17,thighL:3,shinL:0,thighR:5,shinR:2,footL:0,footR:0,root:[-.02,-.035]}),
    /* child's pose ("tortuga"): kneeling, folded forward, arms long in front */
    tortuga:D({view:'side',lumbar:170,thorax:172,neck:168,head:-25,uArmL:178,fArmL:180,uArmR:176,fArmR:179,thighL:125,shinL:0,thighR:123,shinR:2,footL:0,footR:0,root:[.1,-.15]}),
    /* "osito dormilón": lying on the back, relaxed */
    osito:D({view:'side',lumbar:180,thorax:180,neck:180,head:0,uArmL:5,fArmL:0,uArmR:8,fArmR:3,thighL:0,shinL:0,thighR:2,shinR:1,footL:-80,footR:-80,root:[.1,-.07]}),
  };
  const lerpA=(a,b,t)=>{let d=((b-a+540)%360)-180;return a+d*t};
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  function pose(n){if(!P[n])throw new Error('RIG: unknown pose '+n);return P[n]}
  /* joint-space interpolation: every bone is interpolated RELATIVE to its parent (knee vs thigh, elbow vs upper arm,
     hip vs spine...), linearly within (-180,180], so a joint never swings through the inside of the body
     (no knees bending backwards, no forearm through the arm); arms rise through the sides, not across the face. */
  const PARENT={thorax:['lumbar',0],neck:['thorax',0],uArmL:['thorax',180],uArmR:['thorax',180],fArmL:['uArmL',0],fArmR:['uArmR',0],
    thighL:['lumbar',180],thighR:['lumbar',180],shinL:['thighL',0],shinR:['thighR',0],footL:['shinL',0],footR:['shinR',0]};
  const ORDER=['thorax','neck','uArmL','uArmR','fArmL','fArmR','thighL','thighR','shinL','shinR','footL','footR'];
  /* anatomical range per joint: the relative angle is expressed inside [lo, lo+360), chosen so the joint's
     real motion never crosses the range boundary (shoulder: lots of forward/up flexion, little extension;
     knee/elbow: bend one way only). Front view mirrors left/right; side view faces screen-left. */
  const RANGE={side:{uArmL:-90,uArmR:-90,thighL:-90,thighR:-90,shinL:-200,shinR:-200,fArmL:-200,fArmR:-200},
               front:{uArmL:-90,uArmR:-270,thighL:-90,thighR:-270,shinL:-200,shinR:-160,fArmL:-190,fArmR:-170}};
  /* elbows: the forearm is interpolated relative to the upper arm inside the elbow's range (never the shortest
     world-angle path), so an elbow straightens and bends like a hinge and never spins through the arm. */
  const inRange=(a,lo)=>((a-lo)%360+360)%360+lo;
  const rel=(p,n,view)=>{const[q,off]=PARENT[n],lo=(RANGE[view]||{})[n];return inRange(p[n]-p[q]-off,lo===undefined?-180:lo)};
  function blend(a,b,t){
    a=typeof a==='string'?pose(a):a;b=typeof b==='string'?pose(b):b;t=Math.max(0,Math.min(1,t));const k=ease(t),o={};
    o.lumbar=lerpA(a.lumbar,b.lumbar,k);o.head=a.head+(b.head-a.head)*k;

function pad(t,notes,dur,v=.045){notes.forEach(m=>{for(const det of[-6,6]){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='triangle';o.frequency.value=mtof(m+12);o.detune.value=det;lp.frequency.value=1400;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.5);g.gain.setValueAtTime(v,t+dur-.4);g.gain.linearRampToValueAtTime(0,t+dur+.3);o.connect(lp);lp.connect(g);g.connect(musicBus);o.start(t);o.stop(t+dur+.4)}})}
function noise(t,dur,peak,type,freq,dest=musicBus,q=1){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;f.Q.value=q;env(g,t,.002,peak,dur);s.connect(f);f.connect(g);g.connect(dest);s.start(t);s.stop(t+dur+.05)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(45,t+.14);env(g,t,.003,.5,.22);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.3)}
const BPM=STORY.bpm||104,EI=60/BPM/2,FINALE=STORY.finale||116.6;
const CH=STORY.chords||[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],ROOT=STORY.roots||[48,45,41,43];
const MEL=STORY.melody||[[72,0,76,79,76,0,74,72],[69,72,76,0,74,72,69,0],[72,0,74,77,76,74,72,0],[71,74,79,0,77,76,74,0],
           [79,0,76,72,74,76,79,81],[81,0,79,76,72,0,74,76],[77,76,74,72,74,0,77,0],[79,77,76,74,71,0,74,0]];
const CLAVE=[0,3,6,10,12];
let nextStep=0;
function playStep(n,t,st){
  const bar=Math.floor(n/8),pos=n%8,ci=bar%4,vi=(Math.floor(bar/4)%2)*4+ci;
  if(st>=FINALE){if(n===Math.ceil(FINALE/EI)){(STORY.finaleNotes||[60,64,67,72,76,79,84]).forEach((m,i)=>marimba(t+i*.09,m,.28));pad(t,STORY.finalePad||[48,55,60,64],3.2,.05);osc('sine',2093,t+.7,1.8,.08,musicBus)}return}
  const soft=STORY.soft(st),intro=st<(STORY.intro??7);
  if(pos===0)pad(t,CH[ci],EI*8,soft?.05:.035);
  const m=MEL[vi][pos];
  if(m){if(soft){if(pos%2===0)marimba(t,m,.16)}else marimba(t,m,intro?.15:.22)}
  if(intro)return;
  if(pos===0||(!soft&&pos===4))bass(t,ROOT[ci]);
  if(!soft&&(pos===3||pos===6))bass(t,ROOT[ci]+7,.22);
  if(soft)return;
  if(pos===0||pos===4)kick(t);
  if(pos%2===1)noise(t,.045,.07,'highpass',7000);
  if(CLAVE.includes(n%16))osc('sine',2350,t,.05,.09,musicBus,.001,.05);
}
function schedule(){
  if(!AC||!playing||!musicOn)return;const nw=AC.currentTime;
  while(nextStep*EI<T+.25){const st=nextStep*EI;if(st>=T-.03&&st<DUR)playStep(nextStep,nw+Math.max(0,st-T),st);nextStep++}
}
function resync(){nextStep=Math.ceil(T/EI)}
/* sfx */
const sfx={
  whUp(){const t=now(),o=osc('sine',420,t,.5,.16,sfxBus,.02,.5);o.frequency.exponentialRampToValueAtTime(1300,t+.45)},
  whDown(){const t=now(),o=osc('sine',1500,t,1.4,.1,sfxBus,.05,1.4);o.frequency.exponentialRampToValueAtTime(280,t+1.4)},
  boing(){const t=now(),o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg2=AC.createGain();o.frequency.setValueAtTime(170,t);o.frequency.linearRampToValueAtTime(420,t+.35);l.frequency.value=26;lg2.gain.value=45;l.connect(lg2);lg2.connect(o.frequency);env(g,t,.005,.35,.6);o.connect(g);g.connect(sfxBus);o.start(t);l.start(t);o.stop(t+.7);l.stop(t+.7)},
  chirp(){const t=now();for(let i=0;i<3;i++){const o=osc('sine',2600,t+i*.11,.08,.12,sfxBus,.005,.08);o.frequency.setValueAtTime(2600,t+i*.11);o.frequency.exponentialRampToValueAtTime(3900,t+i*.11+.07)}},
  plop(v=.4){const t=now(),o=osc('sine',700,t,.2,v,sfxBus,.003,.2);o.frequency.exponentialRampToValueAtTime(140,t+.14)},
  plopEcho(){const t=now(),o=osc('sine',800,t,.25,.4,sfxBus,.003,.25);o.frequency.exponentialRampToValueAtTime(160,t+.15);const o2=osc('sine',800,t,.25,.3,echoIn,.003,.25);o2.frequency.exponentialRampToValueAtTime(160,t+.15)},
  squeak(){const t=now();for(let i=0;i<2;i++){const o=osc('sine',3000,t+i*.12,.06,.07,sfxBus,.003,.06);o.frequency.exponentialRampToValueAtTime(4300,t+i*.12+.05)}},
  harp(up=true){const t=now(),sc=[72,74,76,79,81,84,86,88,91,93,96];sc.forEach((m,i)=>{const k=up?i:sc.length-1-i;osc('sine',mtof(m),t+k*.06,.9,.08,sfxBus,.003,.9);osc('sine',mtof(m),t+k*.06,.9,.05,echoIn,.003,.9)})},
  sparkle(){const t=now();[96,100,103,108].forEach((m,i)=>osc('sine',mtof(m),t+i*.07,.5,.06,sfxBus,.002,.5))},
  twinkle(){const t=now();[84,91,88,96,93,100].forEach((m,i)=>{osc('sine',mtof(m),t+i*.12,.8,.05,sfxBus,.002,.8);osc('sine',mtof(m),t+i*.12,.8,.04,echoIn,.002,.8)})},
  splash(){const t=now();noise(t,.7,.5,'bandpass',1300,sfxBus,.6);noise(t+.05,.35,.25,'highpass',3500,sfxBus);sfx.plop(.3)},
  crack(){const t=now();for(let i=0;i<5;i++)noise(t+i*.07,.05,.3,'bandpass',2400,sfxBus,2)},
  rumble(){const t=now();noise(t,.9,.5,'lowpass',260,sfxBus);sfx.plop(.25)},
  boom(){const t=now();noise(t,1.4,.7,'lowpass',180,sfxBus);noise(t,.5,.3,'bandpass',600,sfxBus,.8);const o=osc('sine',90,t,.8,.5,sfxBus,.005,.8);o.frequency.exponentialRampToValueAtTime(35,t+.7)},
  hiss(){const t=now();noise(t,2.2,.18,'highpass',4000,sfxBus)},
  rain(){const t=now();noise(t,3.5,.16,'bandpass',2600,sfxBus,.5);for(let i=0;i<10;i++){const o=osc('sine',900+i*37,t+i*.3,.1,.08,sfxBus,.002,.1);o.frequency.exponentialRampToValueAtTime(300,t+i*.3+.08)}},
  whoosh(){const t=now();const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='bandpass';f.Q.value=1.2;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(3000,t+.6);env(g,t,.15,.35,.6);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+.9)},
  ding(){const t=now();osc('sine',1318.5,t,1.1,.14,sfxBus,.003,1.1);osc('sine',2637,t,.6,.05,sfxBus,.003,.6)},
};
const EVENTS=STORY.events(sfx);

/* ---------- voice (recorded neural clips in window.VOZ, played through Web Audio) ---------- */
let VBUF=[],vSrc=[];
function b64buf(b64){const bin=atob(b64),u8=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u8[k]=bin.charCodeAt(k);return u8.buffer}
function loadVoices(){
  if(!AC||!window.VOZ||VBUF.length)return;
  VBUF=window.VOZ.map(()=>null);
  window.VOZ.forEach((b64,i)=>{try{AC.decodeAudioData(b64buf(b64),b=>{VBUF[i]=b;try{analyze(i,b)}catch(_){}},()=>{})}catch(_){}});
}
function playClip(i,offset=0){
  const b=VBUF[i];if(!b||offset>=b.duration)return false;
  const s=AC.createBufferSource();s.buffer=b;s.connect(voiceBus);s.start(AC.currentTime,offset);
  vSrc.push(s);s.onended=()=>{vSrc=vSrc.filter(x=>x!==s)};return true;
}
function stopClips(){vSrc.forEach(s=>{try{s.stop()}catch(_){}});vSrc=[]}
function voiceBusy(){return vSrc.length>0}
function say(L){
  if(!voiceOn||!AC||!window.VOZ)return;
  const tryPlay=n=>{if(!playing||!voiceOn||activeLine()!==L)return;if(VBUF[L.i]){stopClips();playClip(L.i,Math.max(0,T-L.t))}else if(n<12)setTimeout(()=>tryPlay(n+1),150)};
  tryPlay(0);
}
function hush(){stopClips()}
function resumeLineAt(){const L=activeLine();if(L&&voiceOn&&AC&&VBUF[L.i])playClip(L.i,T-L.t)}

/* ---------- player ---------- */
/* The web player chrome is optional: a story can ship only <canvas id="cv">. Missing controls become
   hidden stubs, and clicking the canvas plays/pauses (handy for previewing before rendering). */
const $=id=>document.getElementById(id)||(()=>{const e=document.createElement(id==='seek'?'input':'div');e.id=id;e.hidden=true;document.body.appendChild(e);return e})();
if(!document.getElementById('pp'))cv.addEventListener('click',()=>$('pp').click());
/* pages without the web chrome get a simple centred play button (hidden during export by __begin) */
if(!document.getElementById('bigplay')){
  const b=document.createElement('button');b.id='bigplay';b.setAttribute('aria-label','Ver el cuento');
  b.innerHTML='<svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>';
  b.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.92);color:#1B3A5C;box-shadow:0 10px 30px rgba(0,0,0,.35);display:grid;place-items:center;z-index:5';
  document.body.appendChild(b);
  const c=document.createElement('div');c.id='cover';document.body.appendChild(c);
  new MutationObserver(()=>{b.hidden=c.hidden}).observe(c,{attributes:true});
}
const subs=$('subs'),seek=$('seek'),timeEl=$('time'),cover=$('cover'),endcard=$('endcard');
let subsOn=true,lastLine=null,needResume=false,FIXED=null;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function fit(){if(FIXED){if(cv.width!==FIXED[0]||cv.height!==FIXED[1]){cv.width=FIXED[0];cv.height=FIXED[1]}return}const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);const w=Math.max(320,Math.round(r.width*d)),h=Math.round(w*9/16);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}}
function setPlaying(p){
  playing=p;$('pplabel').textContent=p?'Pausa':'Play';$('pp').setAttribute('aria-label',p?'Pausar':'Reproducir');
  $('ppicon').innerHTML=p?'<path d="M7 5h4v14H7zm6 0h4v14h-4z"/>':'<path d="M8 5.5v13l11-6.5z"/>';
  if(AC&&AC.resume){p?AC.resume():AC.suspend()}
  if(p){resync();if(needResume){needResume=false;resumeLineAt()}}
}
function start(){initAudio();started=true;cover.hidden=true;endcard.hidden=true;if(T>=DUR)T=0;resync();setPlaying(true)}
function frame(tm){
  if(window.__offline)return;
  const dt=Math.min(.1,(tm-last)/1000||0);last=tm;
  if(playing){const prev=T;T=Math.min(DUR,T+dt);
    for(const L of LINES)if(L.t>prev&&L.t<=T)say(L);
    if(AC)for(const e of EVENTS)if(e[0]>prev&&e[0]<=T)try{e[1]()}catch(_){}
    schedule();
    if(AC){const tgt=voiceBusy()?.18:.34;musicBus.gain.setTargetAtTime(musicOn?tgt:0,AC.currentTime,.25)}
    if(T>=DUR){setPlaying(false);endcard.hidden=false}
  }
  fit();
  const shown=started?T:4.6;const keep=T;T=shown;render();T=keep;
  const L=started?activeLine():null;
  if(L!==lastLine){lastLine=L;if(L){subs.textContent=L.text;subs.className='subs '+L.who+(subsOn?'':' off')}else subs.className='subs off'}
  seek.value=T;timeEl.textContent=`${fmt(T)} / ${fmt(DUR)}`;
  requestAnimationFrame(frame);
}
$('bigplay').onclick=start;
$('again').onclick=()=>{T=0;start()};
$('pp').onclick=()=>{if(!started){start();return}if(playing)setPlaying(false);else{if(T>=DUR){T=0}endcard.hidden=true;initAudio();resync();setPlaying(true)}};
$('restart').onclick=()=>{hush();T=0;lastLine=null;if(!started)start();else{endcard.hidden=true;resync();setPlaying(true)}};
seek.oninput=()=>{hush();T=parseFloat(seek.value);resync();lastLine=null;if(playing)resumeLineAt();else needResume=true;if(!started){started=true;cover.hidden=true;initAudio();setPlaying(false)}endcard.hidden=T<DUR};
function toggle(btn,get,set){btn.onclick=()=>{set(!get());btn.setAttribute('aria-pressed',String(get()))}}
toggle($('voice'),()=>voiceOn,v=>{voiceOn=v;if(!v)hush()});
toggle($('music'),()=>musicOn,v=>{musicOn=v;if(v)resync()});
toggle($('cc'),()=>subsOn,v=>{subsOn=v;lastLine=undefined});
$('fs').onclick=()=>{const s=$('stage');try{if(document.fullscreenElement)document.exitFullscreen();else s.requestFullscreen&&s.requestFullscreen().catch(()=>{})}catch(_){}};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('pp').click()}});

/* ---------- offline export hooks (used by tools/render.mjs) ---------- */
window.__dur=DUR;
window.__setT=v=>{T=v};
window.__render=()=>{fit();render()};
window.__lines=()=>LINES.map(L=>({t:L.t,end:L.end,who:L.who,text:L.text}));
/* decode every voice clip and build the lip-sync envelopes before exporting frames (the live player does this on first play) */
window.__prepare=async()=>{if(!window.VOZ)return 0;const A=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,48000,48000);let n=0;
  for(let i=0;i<window.VOZ.length;i++){try{const b=await A.decodeAudioData(b64buf(window.VOZ[i]));analyze(i,b);n++}catch(_){}}return n};
window.__begin=(w,h)=>{window.__offline=true;FIXED=[w,h];started=true;cover.hidden=true;endcard.hidden=true;subs.className='subs off'};
/* one 16:9 frame at story time t, as a JPEG data URL */
window.__frame=(t,q=.92)=>{T=t;fit();render();return cv.toDataURL('image/jpeg',q)};
/* one 9:16 Shorts frame: story frame centered over a blurred copy, big hook on top, captions and CTA below */
let SC=null;
window.__short=(t,local,spec,q=.92)=>{
  T=t;fit();render();
  if(!SC){SC=document.createElement('canvas');SC.width=1080;SC.height=1920}
  const g=SC.getContext('2d');g.setTransform(1,0,0,1,0,0);
  /* soft background: shrink the centre of the frame to a tiny canvas and scale it back up (a cheap blur) */
  if(!SC.sb){SC.sb=document.createElement('canvas');SC.sb.width=36;SC.sb.height=64}
  const cw=cv.height*9/16;SC.sb.getContext('2d').drawImage(cv,(cv.width-cw)/2,0,cw,cv.height,0,0,36,64);
  g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.filter='saturate(1.2) brightness(.62)';g.drawImage(SC.sb,0,0,1080,1920);g.filter='none';
  const fw=1080,fh=608,fy=660;
  g.save();g.shadowColor='rgba(0,0,0,.5)';g.shadowBlur=40;g.shadowOffsetY=16;g.fillStyle='#000';g.fillRect(0,fy,fw,fh);g.restore();g.drawImage(cv,0,fy,fw,fh);
  const pop=k=>{const c1=1.9,c3=c1+1,x=Math.min(1,Math.max(0,k));return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
  const txt=(s,x,y,size,fill,font,k,maxW)=>{g.save();g.translate(x,y);const sc=pop(k);g.scale(sc,sc);g.font=`${font.includes('Bagel')?400:700} ${size}px ${font}`;g.textAlign='center';g.textBaseline='middle';
    const words=s.split(' '),lines=[];let cur='';words.forEach(w=>{const tr=cur?cur+' '+w:w;if(g.measureText(tr).width>maxW&&cur){lines.push(cur);cur=w}else cur=tr});lines.push(cur);
    lines.forEach((l,i)=>{const yy=(i-(lines.length-1)/2)*size*1.1;g.lineJoin='round';g.lineWidth=size*.16;g.strokeStyle='rgba(20,8,12,.85)';g.strokeText(l,0,yy);g.fillStyle=fill;g.fillText(l,0,yy)});g.restore()};
  txt(spec.hook,540,330,104,spec.hookColor||'#ffd36b',"'Bagel Fat One',Fredoka,sans-serif",local/.45,960);
  const L=activeLine();if(L)txt(L.text,540,1400,58,L.who==='n'?'#ffffff':(spec.voiceColor||'#bfe9ff'),"Fredoka,sans-serif",1,960);
  txt(spec.cta||'Mira el cuento completo en MitoloKids',540,1640,54,'#ffffff',"Fredoka,sans-serif",(local-(spec.dur||15)+3.2)/.4,940);
  g.fillStyle='rgba(255,255,255,.85)';g.fillRect(0,1906,1080*Math.min(1,local/(spec.dur||15)),14);
  return SC.toDataURL('image/jpeg',q);
};
/* 1280x720 thumbnail: story frame + big two-line title with a paper-cut shadow */
window.__thumb=(t,title,color='#ffd36b')=>{
  T=t;fit();render();const c=document.createElement('canvas');c.width=1280;c.height=720;const g=c.getContext('2d');
  g.drawImage(cv,0,0,1280,720);const gr=g.createLinearGradient(0,0,0,300);gr.addColorStop(0,'rgba(10,4,8,.55)');gr.addColorStop(1,'rgba(10,4,8,0)');g.fillStyle=gr;g.fillRect(0,0,1280,300);
  g.font="400 118px 'Bagel Fat One',Fredoka,sans-serif";g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  title.split('\n').forEach((l,i)=>{const y=110+i*120;g.lineWidth=22;g.strokeStyle='rgba(20,8,12,.9)';g.strokeText(l,640,y);g.fillStyle=i?'#ffffff':color;g.fillText(l,640,y)});
  return c.toDataURL('image/jpeg',.92);
};
/* whole soundtrack (music + sfx + voices, with ducking) rendered offline; resolves to base64 16-bit WAV */
window.__renderAudio=async()=>{
  const SR=48000,len=Math.ceil((DUR+1.5)*SR),off=new OfflineAudioContext(2,len,SR);
  initAudio(off);
  const bufs=await Promise.all((window.VOZ||[]).map(b=>off.decodeAudioData(b64buf(b)).catch(()=>null)));
  for(let n=0;n*EI<DUR;n++)playStep(n,n*EI,n*EI);
  for(const e of EVENTS){OFF_AT=e[0];try{e[1]()}catch(_){}}OFF_AT=null;
  musicBus.gain.setValueAtTime(.34,0);
  LINES.forEach(L=>{const b=bufs[L.i];if(!b)return;const s=off.createBufferSource();s.buffer=b;s.connect(voiceBus);s.start(L.t);musicBus.gain.setTargetAtTime(.18,L.t,.25);musicBus.gain.setTargetAtTime(.34,L.t+b.duration,.25)});
  const out=await off.startRendering();
  const ch=[out.getChannelData(0),out.getChannelData(1)],n=out.length,buf=new ArrayBuffer(44+n*4),v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,SR,true);v.setUint32(28,SR*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*4,true);
  let o=44;for(let i=0;i<n;i++)for(let c=0;c<2;c++){const x=Math.max(-1,Math.min(1,ch[c][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
  const u8=new Uint8Array(buf);let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));
  AC=null;return btoa(s);
};
requestAnimationFrame(frame);

})();
</script>
