<!--
  ESTELA Y LOS PLANETAS — dirección de arte
  Paleta (tiza pastel sobre fieltro cálido):
    espacio fieltro #221f3a · mantequilla #ffe08f · durazno #ffbf9b · coral #f2826a
    menta #a8e6c8 · lila #cbb6f0 · cielo #8ec9ee · papel #fbf3e3 · tinta #3b2d4f
  Técnica: mundo 3D completo (three.js r128) con materiales mate de plastilina/fieltro
    (rugosidad 1, bultitos en los vértices, texturas pintadas a mano con fibras y costuras),
    luz hemisférica suave + el Sol como luz puntual cálida + borde "pelusa" de fieltro.
    Órbitas cosidas con puntadas de hilo, estrellas de puntitos de fieltro.
    Encima, capas 2D de papel rasgado: tarjetas de nota con cinta washi, etiquetas con hilo,
    tira de papel con el orden de los 8 planetas, tarjeta de título y de "¡Fin!".
  Tipografía: Bagel Fat One (nombres, títulos) + Fredoka (datos).
  Momento estrella: Estela atraviesa en 3D los anillos de Saturno entre piedritas de hielo.
  Personajes: Estela (cometita curiosa, cola de chispas pastel) y el Abuelo Sol
    (sol de fieltro acolchado con cejas y bigote de lana; su voz hace latir la luz).
