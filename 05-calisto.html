<!--
  Calisto y la Osa Mayor · MitoloKids, episodio 05 (libro Mitolokids, Vol. 1 "El cielo", cuento 1)
  Técnica: "Dos mundos de papel", animación 2D de recortes (cut-out). Sin 3D, sin brillos, sin bokeh.
    ORDEN (dioses, cielo, ciencia): círculos y triángulos perfectos, líneas de regla, pegatinas doradas,
      simetría. Kit compartido engine/mito.js: orderCircle, orderTri, sticker, goldStar, rulerLine.
    VIDA (Calisto, Arcas, el bosque): papel rasgado con fibra blanca, crayón, cinta chueca: tornEllipse, tornPoly, tape.
    Las emociones cambian la geometría: la diosa gruñona pasa de campana redonda a triángulo afilado inclinado;
      la barba de Zeus pasa de círculos a picos cuando grita.
  Paleta oficial: Prusia #1B3A5C, cianotipo #2E5E8C, crema #F3E9D2, terracota #C8643B, ocre #D9A441,
    salvia #7E9A7A, carbón #2B2A2E, kraft #B08A5B.
  Tipografía en pantalla: Andika.
  Momento estrella: la osa y el osito de papel rasgado se deshacen, de arriba abajo, en pegatinas doradas
    unidas con regla: las estrellas reales de la Osa Mayor y la Osa Menor (proyección polar de sus coordenadas).
  Secreto: la estrella del pecho de la osa está en Merak, una de las dos estrellas del cucharón que apuntan
    a la Estrella Polar (la punta de la cola del osito). Su corazón señala el norte.
-->

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=1280,H=720,DUR=120,TAU=Math.PI*2;
let T=0,playing=false,started=false,last=0;
/* ==========================================================================
   Mitolokids shared kit: Mito the owl + "dos mundos de papel" helpers.
   Include it in a Mitolokids episode with the marker  /*@@INCLUDE mito@@*\/
   (tools/build.mjs inlines this file there). Uses the story's ctx and T.

   Palette (biblia visual): PAL.prusia #1B3A5C, PAL.ciano #2E5E8C, PAL.crema #F3E9D2,
   PAL.terracota #C8643B, PAL.ocre #D9A441, PAL.salvia #7E9A7A, PAL.carbon #2B2A2E, PAL.kraft #B08A5B

   VIDA (humans, earth)  -> torn paper:  tornEllipse / tornPoly  (white fibre edge, wobbly)
   ORDEN (gods, sky)     -> exact geometry: orderCircle / orderTri / goldStar / sticker
   boil: torn edges re-jitter 4 times per second (hand-made feel, subtle)
   ========================================================================== */
const PAL={prusia:'#1B3A5C',ciano:'#2E5E8C',crema:'#F3E9D2',terracota:'#C8643B',ocre:'#D9A441',salvia:'#7E9A7A',carbon:'#2B2A2E',kraft:'#B08A5B'};
const boilSeed=()=>Math.floor(T*4);
/* integer hash -> [-1,1]; Math.imul keeps it exact for any seed size */
function _hash(n){n=Math.imul((n|0)^((n|0)>>>16),0x45d9f3b);n=Math.imul(n^(n>>>16),0x45d9f3b);n^=n>>>16;return (n>>>0)/2147483647.5-1}
/* deterministic jagged outline around an ellipse; seed keeps each shape's tear stable, boil adds tiny motion */
function _tornPts(cx,cy,rx,ry,seed,rough=.05,n=56,rot=0){const pts=[],b=boilSeed();for(let i=0;i<n;i++){const a=i/n*Math.PI*2,j=1+rough*(_hash(seed*131+i*7)*.8+_hash(seed*17+i*3+b*997)*.25);const x=Math.cos(a)*rx*j,y=Math.sin(a)*ry*j;pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}return pts}
function _poly(pts){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath()}
function _paperShadow(a=.28,b=10,oy=5){ctx.shadowColor=`rgba(20,16,24,${a})`;ctx.shadowBlur=b;ctx.shadowOffsetY=oy}
/* torn paper ellipse: white fibrous rim underneath, coloured sheet on top */
function tornEllipse(cx,cy,rx,ry,col,seed=1,o={}){
  ctx.save();if(o.shadow!==false)_paperShadow();
  _poly(_tornPts(cx,cy,rx+1.6,ry+1.6,seed+50,(o.rough||.05)*2.1,o.n||72,o.rot||0));ctx.fillStyle=o.rim||'#fbf7ee';ctx.fill();ctx.restore();
  ctx.save();_poly(_tornPts(cx,cy,rx,ry,seed,o.rough||.05,o.n||56,o.rot||0));ctx.fillStyle=col;ctx.fill();ctx.restore();
}
/* torn paper polygon: pts = [[x,y],...] corners; edges get subdivided and jittered */
function tornPoly(pts,col,seed=1,o={}){
  const out=[],b=boilSeed(),amp=o.amp||3;
  pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length],len=Math.hypot(q[0]-p[0],q[1]-p[1]),n=Math.max(2,Math.round(len/14));for(let k=0;k<n;k++){const t=k/n,nx=-(q[1]-p[1])/len,ny=(q[0]-p[0])/len,j=amp*(_hash(seed*97+i*31+k*5)+.35*_hash(seed+i*13+k*7+b*991));out.push([p[0]+(q[0]-p[0])*t+nx*j,p[1]+(q[1]-p[1])*t+ny*j])}});
  ctx.save();if(o.shadow!==false)_paperShadow();_poly(out.map(p=>p));ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle=o.rim||'#fbf7ee';ctx.stroke();ctx.fillStyle=col;ctx.fill();ctx.restore();
}
/* ORDEN: exact geometry, flat colour, crisp */
function orderCircle(cx,cy,r,col,o={}){ctx.save();if(o.shadow!==false)_paperShadow(.22,6,3);ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function orderTri(x1,y1,x2,y2,x3,y3,col,o={}){ctx.save();if(o.shadow!==false)_paperShadow(.22,6,3);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.restore()}
function goldStar(cx,cy,r,rot=0,o={}){ctx.save();if(o.shadow!==false)_paperShadow(.25,5,2);ctx.beginPath();for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();const g=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,'#f3cf6b');g.addColorStop(.5,PAL.ocre);g.addColorStop(1,'#b8862a');ctx.fillStyle=g;ctx.fill();ctx.restore()}
/* round gold sticker (a star in the ORDEN world): a perfect dot with a tiny glint */
function sticker(cx,cy,r,col=PAL.ocre){orderCircle(cx,cy,r,col);ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(cx-r*.35,cy-r*.35,r*.28,0,Math.PI*2);ctx.fill()}
/* ruler line (constellation lines, "orden") */
function rulerLine(x1,y1,x2,y2,col=PAL.crema,w=3,p=1){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x1+(x2-x1)*p,y1+(y2-y1)*p);ctx.stroke();ctx.restore()}
/* crooked tape strip */
function tape(cx,cy,w,rot,col='rgba(246,236,200,.78)'){ctx.save();ctx.translate(cx,cy);ctx.rotate(rot);ctx.fillStyle=col;ctx.fillRect(-w/2,-11,w,22);ctx.restore()}
/* scanned-paper finish for the whole frame: call last in render() (after everything, before cuts) */
let _grain=null;
function paperFinish(W,H,a=.28){
  if(!_grain){_grain=document.createElement('canvas');_grain.width=_grain.height=256;const g=_grain.getContext('2d'),id=g.createImageData(256,256);let s=7;for(let i=0;i<id.data.length;i+=4){s=(s*16807)%2147483647;const v=200+(s%56);id.data[i]=v;id.data[i+1]=v-4;id.data[i+2]=v-14;id.data[i+3]=255}g.putImageData(id,0,0);_grain=ctx.createPattern(_grain,'repeat')}
  ctx.save();ctx.globalAlpha=a;ctx.globalCompositeOperation='multiply';ctx.fillStyle=_grain;ctx.fillRect(0,0,W,H);ctx.restore();
}

/* ---------- Mito, la lechucita preguntona ----------
   drawMito(x, y, s, o): (x,y) = centre of the body, s = scale (1 ≈ 150 px tall).
   o.look [-1..1, -1..1]   where the googly pupils point (they also wobble after moves)
   o.brows 'neutral'|'up'|'worried'|'angry'|'surprised'
   o.mouth {open}          beak opens (use mouthOf('m'))
   o.flap  0..1            wing flap amount
   o.face  1|-1            facing (mirror)
   o.hide  0..1            peek from behind something: 0 full body, 1 only eyes above y
   o.cover true            wings cover the eyes (Mito se tapa la cara)
   o.stickers n            gold stickers earned on the feathers (secret arc), default 0      */
function drawMito(x,y,s,o={}){
  const t=T,look=o.look||[0,0],flap=o.flap||0,f=o.face||1,open=(o.mouth&&o.mouth.open)||0;
  ctx.save();ctx.translate(x,y);ctx.scale(s*f,s);
  const bob=Math.sin(t*2.2)*2;ctx.translate(0,bob);
  if(o.hide){ctx.beginPath();ctx.rect(-200,-200,400,200+(1-o.hide)*260-40);ctx.clip()}
  /* feet */
  orderTri(-22,70,-10,70,-16,80,PAL.terracota,{shadow:false});orderTri(10,70,22,70,16,80,PAL.terracota,{shadow:false});
  /* wings (torn), behind body */
  const wa=.25+flap*.9*Math.abs(Math.sin(t*14));
  ctx.save();ctx.translate(-52,5);ctx.rotate(wa);tornEllipse(-8,18,22,40,'#264f78',11,{rot:.2});ctx.restore();
  ctx.save();ctx.translate(52,5);ctx.rotate(-wa);tornEllipse(8,18,22,40,'#264f78',12,{rot:-.2});ctx.restore();
  /* ear tufts + body (torn blue paper) + cream belly */
  tornPoly([[-50,-48],[-40,-78],[-22,-56]],PAL.ciano,21,{amp:2});tornPoly([[50,-48],[40,-78],[22,-56]],PAL.ciano,22,{amp:2});
  tornEllipse(0,0,58,72,PAL.ciano,3);
  tornEllipse(0,26,36,40,PAL.crema,4,{shadow:false});
  /* belly feather marks (crayon) */
  ctx.save();ctx.strokeStyle='rgba(176,138,91,.7)';ctx.lineWidth=2.5;ctx.lineCap='round';
  for(let i=0;i<5;i++){const bx=-18+(i%3)*18,by=18+Math.floor(i/3)*18+(i%3===1?-6:0);ctx.beginPath();ctx.arc(bx,by,6,.15*Math.PI,.85*Math.PI);ctx.stroke()}ctx.restore();
  /* gold star on the chest: ORDEN */
  goldStar(0,14,12,Math.sin(t*1.3)*.05);
  /* secret arc: earned stickers */
  for(let i=0;i<(o.stickers||0);i++)sticker(-38+i*10,-18+(i%2)*10,4.2,i%2?PAL.ocre:'#e9c46a');
  /* eyes: huge geometric googly eyes (gold ring, white disc, black pupil with lag wobble) */
  const wob=Math.sin(t*9)*.12*(o.wobble??1);
  for(const ex of[-24,24]){
    orderCircle(ex,-28,25,PAL.ocre,{shadow:true});orderCircle(ex,-28,20,'#ffffff',{shadow:false});
    if(o.cover)continue;
    const px=ex+(look[0]+wob)*9,py=-28+(look[1]+Math.abs(wob)*.6)*9;
    ctx.fillStyle='#141414';ctx.beginPath();ctx.arc(px,py,o.brows==='surprised'?8:10,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(px-3,py-3,2.6,0,Math.PI*2);ctx.fill();
  }
  /* brows: straight white paper strips; expression = angle */
  const br={neutral:[0,0],up:[-.18,-6],worried:[.35,-2],angry:[-.4,2],surprised:[0,-10]}[o.brows||'neutral'];
  for(const d of[-1,1]){ctx.save();ctx.translate(d*24,-56+br[1]);ctx.rotate(d*br[0]);_paperShadow(.2,4,2);ctx.fillStyle='#fbf7ee';ctx.fillRect(-15,-3.5,30,7);ctx.restore()}
  /* beak: perfect terracotta triangle, lower half drops when talking */
  orderTri(-9,-12,9,-12,0,4-open*2,PAL.terracota);
  if(open>.05)orderTri(-6,-6+open*2,6,-6+open*2,0,6+open*12,'#9e4a28',{shadow:false});
  /* wings over the face */
  if(o.cover){tornEllipse(-22,-30,26,20,'#264f78',31);tornEllipse(22,-30,26,20,'#264f78',32)}
  ctx.restore();
}


/* ---------- math (everything is a function of T; seeded hashes only) ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

const ENV=[];
function analyze(i,b){

  for(let k=0;k<n;k++){let s=0,c=0;for(let j=k*hop+1;j<(k+1)*hop;j++){s+=d[j]*d[j];if((d[j]>0)!==(d[j-1]>0))c++}rms[k]=Math.sqrt(s/hop);z[k]=c/hop;if(rms[k]>mx)mx=rms[k]}
  for(let k=0;k<n;k++)rms[k]=Math.pow(rms[k]/mx,.6);ENV[i]={rms,z};
}
function mouthOf(who){

}
