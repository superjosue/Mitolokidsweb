  MITOLOKIDS · PRESENTACIÓN DEL CANAL (tráiler de 30 s)
  Estilo base "Acuarela geométrica viva" (docs/estilo-base.md) llevado al extremo técnico: TODO es un PLANO.
    Una gran hoja de cianotipo (3840x2160 "mundo") dividida en 8 viñetas técnicas alrededor de un centro donde vive Mito.
    La cámara recorre la hoja un compás por tema (la música manda el ritmo) y al final se aleja para ver el plano entero
    y vuelve al logo con un sello de "¡APROBADO!".
  Temas (datos reales, presentados como contenido):
    01 Matemáticas  3²+4²=5² con cuadrados que se llenan de acuarela; π = la rueda que se desenrolla (π·d)
    02 Física       péndulo con arco y plomada; tiro parabólico con puntos a tiempos iguales y vector g
    03 Química      átomo con 3 órbitas; H₂O con su ángulo de 104.5°; fichas H, He, C, O, Au
    04 Astronomía   la Tierra alrededor del Sol (365 días) con la Luna; Osa Mayor
    05 Naturaleza   cuadrados de Fibonacci y espiral; hélice de ADN
    06 Historia     El Castillo de Chichén Itzá (91 escalones × 4 + 1 = 365); números mayas 0, 1, 5, 13; línea del tiempo
    07 Mitos        columna jónica (Grecia), disco solar de Amaterasu (Japón), Orión
    08 Geografía    globo con meridianos girando (40 075 km), rosa de los vientos N E S O
  Paleta: cianotipo #1d3d63 / #24507f, líneas crema #F3E9D2, lápiz blueprint #a9c9ff, rojo acento #e07d74,
    acuarelas: ocre #D9A441, terracota #C8643B, salvia #8fb07e, turquesa #5fb3a8, rosa #e9b8b0, cielo #9cc6e6, kraft #c9955a.
  Técnica: fondo y manchas de acuarela cacheados; líneas de lápiz que hierven a 12 dibujos/s; capa BP (engine/blueprint.js);
    Mito (dibujo de brand/icon.html) pre-renderizado en 4 poses; confeti geométrico determinista.
  Tipografía: Fredoka (títulos) + IBM Plex Mono (rotulación técnica).
  Música: silbido pegajoso sintetizado (STORY.lead='whistle' en engine/player.js), marimba suave de acompañamiento.
  Momento estrella: "¿POR QUÉ?" -> ¡la estrella de Mito explota en 8 temas! y al final el plano entero se ve de un vistazo.

function makeGrain(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d',{willReadFrequently:true}),id=g.createImageData(256,256),r=rnd(77);
  for(let i=0;i<65536;i++){let v=228+r()*27;if(r()<.03)v-=40*r();id.data[i*4]=v;id.data[i*4+1]=v-3;id.data[i*4+2]=v-9;id.data[i*4+3]=255}

/* ---------- shapes ---------- */
function pathS(g,p,closed){const n=p.length;g.beginPath();
  if(closed){g.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}g.closePath()}
  else{g.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const a=p[i],b=p[i+1];g.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}g.lineTo(p[n-1][0],p[n-1][1])}}

function seg(a,b,n=8){const o=[];for(let i=0;i<=n;i++)o.push([lerp(a[0],b[0],i/n),lerp(a[1],b[1],i/n)]);return o}

function pencil(g,p,seed,o={}){if(p.length<2)return;const r=rnd(seed),w=o.w??1.2,a=o.a??.5,j=o.j??1.3,passes=o.passes??2,ga=g.globalAlpha;
